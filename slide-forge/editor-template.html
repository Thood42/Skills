        N('div.tag',{bind:base+'.tag',html:rich(s.tag||(cls==='after'?'After':'Before'))}),
        N('h3',{bind:base+'.title',html:rich(s.title)}),
        N('ul',{key:base+'.items',arr:base+'.items'},arr(s.items).map(function(x,i){
          return N('li',{bind:base+'.items.'+i,html:rich(x)}); })) ]); }
    return [ kickerN(c.kicker), titleN(c.title),
      N('div.bna',{key:'bna'},[ col(c.before,'before','before'),
        N('div.bna-arrow',{html:'&rarr;'}), col(c.after,'after','after') ]) ]; };

  /* =====================================================================
     RENDER  —  build slides from data, derive numbering, apply per-slide theme
     ===================================================================== */
  function themeStyle(theme){ if(!theme||typeof theme!=='object') return '';
    return Object.keys(theme).map(function(k){ return esc(k)+':'+esc(theme[k]); }).join(';'); }

  function applyGlobalTheme(theme){ if(theme&&typeof theme==='object'){
    var root=D.documentElement; Object.keys(theme).forEach(function(k){ root.style.setProperty(k,theme[k]); }); } }

  /* ---------- brand kit (v2 phase 4): overlays the active theme ----------
     brand.colors map onto the accent slots, brand.fonts swap the font vars,
     brand.logo (an inlined image asset) is auto-placed on cover + closing.
     Brand x theme compose: any theme can wear the brand's colors. */
  var BRAND_SLOTS={accent1:'--cyan',accent2:'--indigo',accent3:'--mint'};
  function applyBrand(brand){ var root=D.documentElement;
    Object.keys(BRAND_SLOTS).forEach(function(k){ root.style.removeProperty('_brand_'+k); });
    if(!brand) return;
    if(brand.colors) Object.keys(BRAND_SLOTS).forEach(function(k){
      if(brand.colors[k]) root.style.setProperty(BRAND_SLOTS[k],brand.colors[k]); });
    if(brand.fonts){
      if(brand.fonts.display) root.style.setProperty('--font-display',"'"+brand.fonts.display+"','DejaVu Sans',system-ui,sans-serif");
      if(brand.fonts.body) root.style.setProperty('--font-body',"'"+brand.fonts.body+"','DejaVu Sans',system-ui,sans-serif"); } }
  function brandMark(brand,lay){ if(!brand||!brand.logo) return null;
    if(lay!=='cover'&&lay!=='closing') return null;
    var url=imageURL(brand.logo); if(!url) return null;
    return N('img.brand-mark',{src:url,alt:brand.name||'logo'}); }

  /* Layouts whose CSS targets the <section> itself. Every other layout styles
     INNER containers only, so putting the layout name on the section would let an
     inner class (e.g. .matrix, .timeline, .stat-grid) restyle the slide and break
     .slide{position:absolute;inset:0}. We add a harmless lyt-<name> hook instead. */
  var SECTION_LAYOUTS={cover:1,divider:1,bignum:1,quote:1,closing:1,manifesto:1,figure:1,diptych:1,image:1};

  /* build ONE <section> — shared by full render and targeted re-render */
  function buildSection(s,i,total,defAmb,brand){
    var lay=s.layout||'raw';
    var sec=D.createElement('section');
    sec.className='slide'+(SECTION_LAYOUTS[lay]?(' '+lay):'')+' lyt-'+lay+(s.class?(' '+s.class):'');
    sec.setAttribute('data-i',String(i+1)); sec.setAttribute('role','group');
    sec.setAttribute('aria-roledescription','slide');
    sec.setAttribute('aria-label','Slide '+(i+1)+' of '+total);
    var sty=themeStyle(s.theme); if(sty) sec.setAttribute('style',sty);
    /* resolve the ambient: a named one injects a universal background layer;
       "none" silences motion; "auto"/absent keeps the layout's built-in ambient. */
    var amb=(s.ambient!=null)?s.ambient:defAmb;
    if(amb==='none'){ sec.setAttribute('data-ambient','none'); }
    else if(amb&&amb!=='auto'){ sec.appendChild(N('div.amb.amb-'+amb,{'aria-hidden':'true'})); }
    var fn=L[lay]||L.raw, out;
    try{ out=fn(s.content||{},{index:i,total:total}); }
    catch(e){ out=[ N('div.title',{style:'color:var(--cyan)',html:'&#9888; layout "'+esc(s.layout)+'" failed'}),
                    N('p.subtitle',{text:e.message}) ]; }
    if(out&&!Array.isArray(out)&&out.raw!=null) sec.insertAdjacentHTML('beforeend',out.raw);
    else (function add(x){ if(x==null||x===false) return;
      if(Array.isArray(x)){ x.forEach(add); return; }
      sec.appendChild(x.nodeType?x:D.createTextNode(String(x))); })(out);
    var bm=brandMark(brand,lay); if(bm) sec.appendChild(bm);
    if(s.doc) sec.appendChild(N('div.doc-panel',null,[
      N('div.doc-h',null,'JSON · layout "'+(s.layout||'')+'"'), N('pre',{text:s.doc}) ]));
    sec.appendChild(N('div.pager',null,pad(i+1)+' / '+pad(total)));
    sec.appendChild(N('div.progress',{style:'width:'+pctw(i+1,total)+'%'}));
    return sec; }

  SG.render=function(deck,data){
    data=data||SG.data; SG.data=data;
    var slides=arr(data.slides), total=slides.length;
    var defAmb=(data.defaults&&data.defaults.ambient)||'auto';
    applyGlobalTheme(data.theme);
    applyBrand(data.brand);
    if(data.meta){ if(data.meta.title) D.title=data.meta.title;
      if(data.meta.seed!=null){ D.documentElement.setAttribute('data-seed',data.meta.seed);
        SG.rng=SG.makeRng(parseInt(data.meta.seed,10)||1); } }
    deck.innerHTML='';
    slides.forEach(function(s,i){ deck.appendChild(buildSection(s,i,total,defAmb,data.brand)); });
    /* re-attach entrance-animation observers to the fresh slide nodes; without
       this the first shown slide keeps .sg-onenter elements at their hidden base */
    if(SG.wireAnims) SG.wireAnims(deck);
  };

  /* targeted re-render: rebuild ONE section in place (content-only edits).
     Structural changes (slide count, theme, brand) still need SG.render. */
  SG.renderSlide=function(deck,i){
    var data=SG.data, slides=arr(data.slides);
    var secs=deck.querySelectorAll('.slide'), old=secs[i];
    if(!old||secs.length!==slides.length){ SG.render(deck,data); return null; }
    var defAmb=(data.defaults&&data.defaults.ambient)||'auto';
    var sec=buildSection(slides[i],i,slides.length,defAmb,data.brand);
    if(old.classList.contains('active')) sec.classList.add('active');
    old.parentNode.replaceChild(sec,old);
    if(SG.wireAnims) SG.wireAnims(sec);
    return sec; };

  /* =====================================================================
     NAVIGATION + responsive fit + per-slide deep links (re-entrant: rebuilt
     on import). Global listeners bind once; refresh() re-reads the slides.
     ===================================================================== */
  function mountNav(deck){
    var slides=[], n=0, cur=0;
    function refresh(){ slides=[].slice.call(deck.querySelectorAll('.slide')); n=slides.length; fromHash(); }
    function clamp(i){ return Math.max(0,Math.min(n-1,i)); }
    function show(i){ cur=clamp(i);
      slides.forEach(function(s,k){ s.classList.toggle('active',k===cur); });
      if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1)); }
    function fromHash(){ var h=parseInt((location.hash||'').slice(1),10); show(isNaN(h)?0:h-1); }
    function fit(){ var s=Math.min(W.innerWidth/1280,W.innerHeight/720); deck.style.transform='scale('+s+')'; }
    SG.show=show; SG.refresh=function(){ refresh(); fit(); };
    if(!SG._bound){ SG._bound=true;
      W.addEventListener('keydown',function(e){
        if(/^(input|textarea|select)$/i.test((e.target.tagName||''))) return;
        if(e.target.isContentEditable) return;                       /* WYSIWYG edit in progress */
        if(D.body.classList.contains('forge-edit')) return;          /* editor owns keys in edit mode */
        if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){ if(SG.stepNext()){ e.preventDefault(); return; } show(cur+1); e.preventDefault(); }
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ show(cur-1); e.preventDefault(); }
        else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(n-1); }
        else if(e.key==='e'||e.key==='E'){ SG.exportJSON(); }
        else if(e.key==='i'||e.key==='I'){ SG.importJSON(); }
        else if(e.key==='p'||e.key==='P'){ W.print(); }
        else if(e.key==='d'||e.key==='D'){ SG.toggleDocs(); }
        else if(e.key==='f'||e.key==='F'){ SG.present(); }
        else if(e.key==='s'||e.key==='S'){ SG.speaker(); } });
      D.addEventListener('fullscreenchange',function(){
        if(!(D.fullscreenElement||D.webkitFullscreenElement)) D.body.classList.remove('presenting'); });
      deck.addEventListener('click',function(e){ if(e.target.closest('a,button,input')) return; if(SG.stepNext()) return; show(cur+1); });
      W.addEventListener('resize',fit);
      W.addEventListener('hashchange',fromHash);
    }
    refresh(); fit();
  }

  /* ---------- click-triggered animation steps (build steps) ----------
     Elements whose animation trigger is "click" carry data-anim-trigger/step.
     Forward navigation plays the next pending step (lowest step number first,
     ties together) before leaving the slide. Going back just navigates. */
  SG.stepNext=function(){
    if(!(SG.data&&SG.data.defaults&&SG.data.defaults.buildSteps)) return false;  /* toggle: off by default */
    var sec=D.querySelector('.slide.active'); if(!sec) return false;
    var pend=[].slice.call(sec.querySelectorAll('[data-anim-trigger="click"]'))
      .filter(function(n){ return !n.classList.contains('run'); });
    if(!pend.length) return false;
    var next=Math.min.apply(0,pend.map(function(n){ return +n.getAttribute('data-anim-step')||0; }));
    pend.filter(function(n){ return (+n.getAttribute('data-anim-step')||0)===next; })
      .forEach(function(n){ n.classList.remove('run'); void n.offsetWidth; n.classList.add('run'); });
    return true; };

  /* ---------- export / import / pdf ---------- */
  SG.exportJSON=function(){
    var blob=new Blob([JSON.stringify(SG.data,null,2)],{type:'application/json'});
    var a=D.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=((SG.data.meta&&SG.data.meta.title)||'deck').replace(/[^\w.-]+/g,'-').toLowerCase()+'.json';
    D.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000); };
  SG.importJSON=function(){ var inp=D.getElementById('deck-import'); if(inp) inp.click(); };
  SG.toggleDocs=function(){ D.body.classList.toggle('hide-docs'); };
  SG.present=function(){
    var el=D.documentElement, fs=D.fullscreenElement||D.webkitFullscreenElement;
    if(!fs){ var req=el.requestFullscreen||el.webkitRequestFullscreen; if(req) req.call(el);
      D.body.classList.add('presenting'); }
    else { var ex=D.exitFullscreen||D.webkitExitFullscreen; if(ex) ex.call(D);
      D.body.classList.remove('presenting'); } };
  function onImportFile(file){ var fr=new FileReader();
    fr.onload=function(){ try{ var data=SG.migrate(JSON.parse(fr.result));
      SG.render(D.getElementById('deck'),data); SG.refresh();
    }catch(err){ alert('Could not import JSON: '+err.message); } };
    fr.readAsText(file); }

  /* ---- resolve animated content to its FINAL state for printing/PDF ----
     window.print() (the P key / Save PDF button) does NOT force reduced motion, so on
     every non-active slide the entrance animations are still in their hidden initial
     state when the browser captures the PDF. beforeprint fills the JS-driven ones
     (count-ups, KPI rings) and flags entrance elements; print CSS resolves the CSS-only
     ones. (render.sh --pdf already forces reduced motion, so this is belt-and-suspenders.) */
  function fmtCompact(n){ var a=Math.abs(n),T=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
    for(var i=0;i<T.length;i++){ if(a>=T[i][0]) return (n/T[i][0]).toFixed(1).replace(/\.0$/,'')+T[i][1]; }
    return String(Math.round(n)); }
  SG.finalizeAnimations=function(scope){ scope=scope||D;
    scope.querySelectorAll('.sg-count').forEach(function(n){
      var to=parseFloat(n.dataset.to)||0, suf=n.dataset.suffix||'';
      n.textContent=(n.dataset.fmt==='compact'?fmtCompact(to):Math.round(to).toLocaleString())+suf; });
    scope.querySelectorAll('.sg-ring').forEach(function(n){
      var p=+n.dataset.p||0, v=n.querySelector('.sg-ring-v');
      n.style.setProperty('--p',p); if(v) v.textContent=p+(n.dataset.suffix||'%'); });
    scope.querySelectorAll('.sg-onenter,.sg-draw').forEach(function(n){ n.classList.add('run'); }); };
  W.addEventListener('beforeprint', function(){ SG.finalizeAnimations(); });

  /* =====================================================================
     SPEAKER VIEW (press S) — popup with the current slide, next-up, presenter
     notes (slides[i].notes) and a timer. The popup carries a copy of the deck
     styles and is driven entirely from this window (no scripts inside it), so
     it works from file:// with zero extra machinery.
     ===================================================================== */
  SG._spk=null;
  SG.speaker=function(){
    if(SG._spk && !SG._spk.closed){ SG._spk.focus(); return; }
    var w=W.open('','forge-speaker','width=1020,height=660');
    if(!w){ alert('Popup blocked - allow popups for this file to use the speaker view.'); return; }
    SG._spk=w;
    var css=''; [].slice.call(D.querySelectorAll('style')).forEach(function(s){ css+=s.textContent+'\n'; });
    var doc=w.document;
    doc.write('<!doctype html><html><head><title>Speaker view</title><style>'+css+'</style><style>'
      +'html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14 !important;color:#dbe3ef;display:block !important;place-items:initial !important;font-family:system-ui,sans-serif}'
      +'.spk-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;height:100%;padding:16px;box-sizing:border-box}'
      +'.spk-stage{position:relative;overflow:hidden;border-radius:10px;background:#000}'
      +'.spk-stage .deck{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;border-radius:0;box-shadow:none}'
      +'.spk-side{display:flex;flex-direction:column;gap:12px;min-width:0}'
      +'.spk-meta{display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums}'
      +'#spk-timer{font-size:34px;font-weight:700;color:#2ee6a6}#spk-clock{font-size:16px;color:#7e8aa0}#spk-pg{font-size:16px;color:#7e8aa0;margin-left:auto}'
      +'.spk-notes{flex:1;background:#12161f;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:14px 16px;'
      +'font-size:17px;line-height:1.6;white-space:pre-wrap;overflow:auto;color:#e8eefb}'
      +'.spk-next{background:#12161f;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 14px;font-size:13px;color:#9aa6ba}'
      +'.spk-next b{display:block;color:#dbe3ef;font-size:15px;margin-top:2px}'
      +'.spk-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7e8aa0;margin:0 0 6px}'
      +'.deck-ui,.forge-chrome{display:none !important}'
      +'</style></head><body>'
      +'<div class="spk-wrap"><div class="spk-stage"><div class="deck" id="spk-cur"></div></div>'
      +'<div class="spk-side"><div class="spk-meta"><span id="spk-timer">0:00</span><span id="spk-clock"></span><span id="spk-pg"></span></div>'
      +'<div><p class="spk-h">Notes</p></div><div class="spk-notes" id="spk-notes"></div>'
      +'<div class="spk-next"><span>Next up</span><b id="spk-next"></b></div></div></div>'
      +'</body></html>');
    doc.close();
    var t0=Date.now(), lastI=-1;
    function fmt(ms){ var s=Math.floor(ms/1000); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
    function titleOf(sl){ return (sl.content&&(sl.content.title||sl.content.statement||sl.content.quote))||sl.layout; }
    function update(){
      if(w.closed){ clearInterval(iv); SG._spk=null; return; }
      var slides=(SG.data&&SG.data.slides)||[]; if(!slides.length) return;
      var i=(parseInt((location.hash||'').slice(1),10)||1)-1; i=Math.max(0,Math.min(slides.length-1,i));
      var wd=w.document;
      if(i!==lastI){ lastI=i;
        var secs=D.querySelectorAll('#deck .slide'), cur=wd.getElementById('spk-cur');
        if(cur&&secs[i]){ cur.innerHTML='';
          var cl=secs[i].cloneNode(true); cl.classList.add('active');
          [].slice.call(cl.querySelectorAll('.forge-handles,.forge-guides,.forge-marquee,.doc-panel')).forEach(function(n){ n.remove(); });
          cur.appendChild(cl); if(SG.finalizeAnimations) SG.finalizeAnimations(cur); }
        wd.getElementById('spk-notes').textContent=slides[i].notes||'(no notes for this slide)';
        var nx=slides[i+1];
        wd.getElementById('spk-next').textContent=nx?((i+2)+' \u00b7 '+titleOf(nx)):'\u2014 end of deck \u2014';
        wd.getElementById('spk-pg').textContent=(i+1)+' / '+slides.length;
        var st=wd.getElementById('spk-cur').parentNode.getBoundingClientRect();
        var sc=Math.min(st.width/1280, st.height/720);
        wd.getElementById('spk-cur').style.transform='scale('+sc+')'; }
      wd.getElementById('spk-clock').textContent=new Date().toLocaleTimeString();
      wd.getElementById('spk-timer').textContent=fmt(Date.now()-t0); }
    var iv=setInterval(update,300); update();
    /* arrows in the popup drive the main deck */
    w.document.addEventListener('keydown',function(e){
      var i=(parseInt((location.hash||'').slice(1),10)||1)-1;
      if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){ SG.show(i+1); e.preventDefault(); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ SG.show(i-1); e.preventDefault(); } });
    w.addEventListener('resize',function(){ lastI=-1; });
  };

  /* ---------- boot ---------- */
  SG.boot=function(){
    loadAssets();
    var deck=D.getElementById('deck');
    var dataEl=D.getElementById('deck-data');
    try{ SG.data=SG.migrate(JSON.parse(dataEl.textContent)); }
    catch(e){ deck.innerHTML='<section class="slide active"><div class="title">⚠ deck-data is not valid JSON</div><p class="subtitle">'+esc(e.message)+'</p></section>'; SG.data=null; return; }
    SG.render(deck,SG.data);
    mountNav(deck);
    var inp=D.getElementById('deck-import');
    if(inp) inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) onImportFile(inp.files[0]); inp.value=''; });
  };
})();
</script>
<style id="forge-css">
/* ============================================================
   SLIDE-FORGE EDITOR LAYER  (additive; present-mode untouched)
   All editor chrome carries .forge-chrome so it is stripped from
   downloads, hidden in print, and hidden during static capture.
   ============================================================ */
@media print { .forge-chrome { display:none !important; } }
html[data-static] .forge-chrome { display:none !important; }

.forge-chrome { font-family:var(--font-body, system-ui, sans-serif); }

/* the launcher button is always visible (bottom-right) */
#forge-launch{
  position:fixed; right:16px; bottom:16px; z-index:9000;
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 16px; border-radius:999px; cursor:pointer;
  background:#11141c; color:#eaf1fb; border:1px solid rgba(255,255,255,.18);
  font-size:13px; font-weight:600; letter-spacing:.02em;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}
#forge-launch:hover{ background:#171b25; }
body.forge-edit #forge-launch{ background:#2a6df4; border-color:#2a6df4; }
body.presenting #forge-launch{ display:none !important; }   /* presentation mode: no chrome at all */

/* In edit mode, reserve room for the side panels by shrinking the stage area. */
body.forge-edit{ overflow:auto; }

/* Hide the present-mode control bar (Present/Docs/Export/Import/Save PDF) while
   editing — the forge toolbar replaces it and it would otherwise overlap. */
body.forge-edit .deck-ui{ display:none !important; }

/* panels --------------------------------------------------- */
.forge-panel{
  position:fixed; top:0; bottom:0; z-index:8500;
  width:248px; background:#0d1017; color:#dbe3ef;
  border-right:1px solid rgba(255,255,255,.08);
  display:none; flex-direction:column; overflow:hidden auto;
  font-size:13px;
}
body.forge-edit .forge-panel{ display:flex; }
#forge-nav{ left:0; border-right:1px solid rgba(255,255,255,.08); }
#forge-inspect{ right:0; left:auto; width:280px; padding-bottom:72px;
  border-left:1px solid rgba(255,255,255,.08); border-right:0; }

.forge-panel h4{
  margin:0; padding:12px 14px 8px; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:#7e8aa0; font-weight:700;
  position:sticky; top:0; background:#0d1017; z-index:1;
}
.forge-sec{ padding:14px 14px 16px; border-bottom:1px solid rgba(255,255,255,.09); }
.forge-sec:last-child{ border-bottom:none; }

/* toolbar -------------------------------------------------- */
#forge-bar{
  position:fixed; top:0; left:248px; right:280px; z-index:8600;
  display:none; align-items:center; gap:6px; flex-wrap:wrap;
  padding:8px 12px; background:#0d1017f2; backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
body.forge-edit #forge-bar{ display:flex; }

.forge-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:8px; cursor:pointer;
  background:#161b25; color:#dbe3ef; border:1px solid rgba(255,255,255,.10);
  font-size:12.5px; font-weight:600;
}
.forge-btn:hover{ background:#1d2330; }
.forge-btn.primary{ background:#2a6df4; border-color:#2a6df4; color:#fff; }
.forge-btn.warn:hover{ background:#7a1f22; border-color:#7a1f22; }
.forge-btn[disabled]{ opacity:.4; cursor:default; }
.forge-sep{ width:1px; height:22px; background:rgba(255,255,255,.12); margin:0 4px; }

/* nav rows ------------------------------------------------- */
.forge-srow{
  display:flex; align-items:center; gap:8px; padding:8px 10px; margin:3px 8px;
  border-radius:8px; cursor:pointer; background:#141923; border:1px solid transparent;
}
.forge-srow:hover{ background:#1a212d; }
.forge-srow.cur{ border-color:#2a6df4; background:#16233d; }
.forge-srow .si{ font:600 11px var(--font-mono,monospace); color:#7e8aa0; min-width:20px; }
.forge-srow .sl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.forge-srow .st{ font-size:10px; color:#7e8aa0; }

/* inspector fields ---------------------------------------- */
.forge-field{ display:flex; flex-direction:column; align-items:stretch; gap:5px; margin:9px 0; }
.forge-field label{ color:#9aa6ba; font-size:11px; font-weight:600; }
.forge-field input[type=number], .forge-field input[type=text], .forge-field select{
  width:100%; padding:6px 8px; border-radius:6px; background:#10151e;
  color:#eaf1fb; border:1px solid rgba(255,255,255,.12); font-size:12px;
}
.forge-field input:focus, .forge-field textarea:focus, .forge-field select:focus{
  outline:none; border-color:#2a6df4; box-shadow:0 0 0 2px rgba(42,109,244,.25); }

       so edits never go stale and survive layout switches.

       surface) overrides layered on a template element or a free object.

                 overrides. No positional tagging (except `raw` slides).

     data-arr  — the content array a container renders; item add/duplicate/
                 remove parse the item index from the element key and REMAP

                 pass in commit drops overrides whose element no longer exists.

    W.addEventListener('scroll',function(){ hideCtxMenu(); if(F.editing) positionFmtBar(); positionFloat(); },true);
    W.addEventListener('resize',function(){ refreshHandles(); positionFloat(); });
    /* drop-on-canvas image/svg import (media plan §3.3): converts the drop
       point to deck-local px through the same scale() the drag code uses,
       lands each dropped file centred there with a small cascade offset for
       multi-file drops. No clipboard paste in v1 — see media plan §7.2. */

      deck.addEventListener('dragover',function(e){ if(!editing()) return;

    }
  }

  /* =====================================================================
     KEYBOARD — capture-phase so edit-mode keys never reach deck navigation.
     ===================================================================== */
  function wireKeys(){ W.addEventListener('keydown',function(e){
    if(!editing()) return;
    if(F.editing) return;                                   /* contenteditable handles its own keys */
    var tag=(e.target.tagName||'').toLowerCase();
    var inField=/^(input|textarea|select)$/.test(tag);
    var mod=e.metaKey||e.ctrlKey;
    if(mod&&(e.key==='z'||e.key==='Z')){ if(inField) return; e.preventDefault(); e.stopPropagation(); e.shiftKey?F.redoOp():F.undoOp(); return; }
    if(mod&&(e.key==='y'||e.key==='Y')){ if(inField) return; e.preventDefault(); e.stopPropagation(); F.redoOp(); return; }
    if(mod&&(e.key==='s'||e.key==='S')){ e.preventDefault(); e.stopPropagation(); F.download(); return; }
    if(inField) return;
    if(mod&&(e.key==='c'||e.key==='C')){ if(F.sels.length){ e.preventDefault(); e.stopPropagation(); F.copySel(); F._pasteN=0; } return; }
    if(mod&&(e.key==='v'||e.key==='V')){ if(F.clipboard){ e.preventDefault(); e.stopPropagation(); F.paste(); } return; }
    if(mod&&(e.key==='d'||e.key==='D')){ if(F.sels.length){ e.preventDefault(); e.stopPropagation(); F.dupSel(); } return; }
    if(mod&&(e.key==='g'||e.key==='G')){ e.preventDefault(); e.stopPropagation(); e.shiftKey?F.ungroupSel():F.groupSel(); return; }
    if(e.key==='?'){ e.preventDefault(); e.stopPropagation(); F.showKeys(); return; }
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); hideCtxMenu(); clearSel(); F.buildInspect(); return; }
    if((e.key==='Delete'||e.key==='Backspace')&&F.sels.length){ e.preventDefault(); e.stopPropagation(); F.deleteSel(); return; }
    if(/^Arrow/.test(e.key)){ e.preventDefault(); e.stopPropagation();
      if(F.sels.length){                                   /* nudge selection (Shift = 10px) */
        var step=e.shiftKey?10:1, dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0, dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
        F.pushUndoCoalesced('nudge');
        F.sels.forEach(function(x){ shiftSel(x,dx,dy); }); refreshHandles(); syncGeomFields(); positionFloat(); F.saveDebounced();
      } else {                                             /* no selection: navigate slides */
        var dir=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
        SG.show&&SG.show(curSlide()+dir); F.buildNav(); F.buildInspect(); }
      return; }
  },true); }

  /* asset-picker widget (media plan §4): a thumbnail + <select> of every

  function assetPickerField(obj,key,kind){
    var wrap=el('div','forge-assetpick');
    var thumb=el('div','forge-assetpick-thumb');
    function paintThumb(){ thumb.innerHTML=''; var v=obj[key]; if(!v) return;
      if(kind==='svg'){ thumb.innerHTML=(SG.svgMarkup&&SG.svgMarkup(v))||''; }
      else { var m=SG.imageMeta&&SG.imageMeta(v); if(m&&m.src){ var img=el('img'); img.src=m.src; img.alt=''; thumb.appendChild(img); } } }
    var sel=el('select');

      var none=el('option','','— none —'); none.value=''; sel.appendChild(none);

        inp.onchange=function(){ var f=inp.files&&inp.files[0]; inp.value=''; if(!f||!F.assets){ paintOptions(); return; }
          F.pushUndo();

            .catch(function(){ F.undo.pop(); F.syncToolbar(); paintOptions(); }); };

  /* generic content form: reflects slides[i].content — plain fields, nested
     objects, and arrays as reorderable cards with add/remove. */
  function contentForm(host,obj,slideIdx,path){
    Object.keys(obj).forEach(function(k){ var v=obj[k];
      if(Array.isArray(v)) arrayEditor(host,obj,k,slideIdx,(path||'')+k);
      else if(v!==null&&typeof v==='object'){ var grp=el('div','forge-card');
        grp.appendChild(el('div','forge-card-h','<span>'+pretty(k)+'</span>'));
        contentForm(grp,v,slideIdx,(path||'')+k+'.'); host.appendChild(grp); }
      else if(typeof v==='boolean') host.appendChild(fieldRow(pretty(k),boundCheck(obj,k)));
      else if(typeof v==='number') host.appendChild(field(pretty(k),boundNum(obj,k)));
      else if(ASSET_FIELDS[k]&&F.assets) host.appendChild(field(pretty(k),assetPickerField(obj,k,ASSET_FIELDS[k])));
      else host.appendChild(field(pretty(k),boundText(obj,k, k==='code'||k==='html'||k==='body'&&String(v).length>80||String(v).length>70||/\n/.test(String(v)) )));
    }); }

  /* =====================================================================
     ELEMENTS TREE — hierarchical view of the slide's elements (template
     blocks, nested items, free objects). Click selects; disclosure arrows
     collapse; hover tools add/duplicate/remove layout items in place.
     ===================================================================== */
  F._treeOpen={};
  function treeChip(host,lab,title,fn,warn){ var b=el('button','forge-chip'+(warn?' warn':''),lab);
    b.title=title; b.setAttribute('aria-label',title); b.onclick=function(e){ e.stopPropagation(); fn(); }; host.appendChild(b); return b; }
  function treeLabel(node){
    if(node.hasAttribute('data-free')){
      var isMediaNode=node.classList.contains('image')||node.classList.contains('svg');
      var fo=node.classList.contains('box')?'Box':node.classList.contains('html')?'Copied group'
        :node.classList.contains('image')?'Image':node.classList.contains('svg')?'Diagram':'Text';
      var extra=isMediaNode?'':node.textContent;
      return '★ '+fo+(extra?' · '+extra.trim().slice(0,20):''); }
    var c=(typeof node.className==='string'?node.className:'').split(' ')[0];
    var name=c&&!/^sg-/.test(c)?c.replace(/-/g,' '):node.tagName.toLowerCase();
    var txt=(node.textContent||'').trim().replace(/\s+/g,' ').slice(0,26);
    return name+(txt?' · '+txt:''); }
  /* build the hierarchy from the authored keys themselves ("stats.2" is a
     child of "stats"), so the tree matches the CONTENT structure even when the
     DOM interleaves (pipeline connectors) or nests differently. */
  function keyedTree(sec){ var map={}, roots=[];
    [].slice.call(sec.querySelectorAll('[data-el]')).forEach(function(n){
      map[n.getAttribute('data-el')]={node:n,kids:[]}; });
    Object.keys(map).forEach(function(k){ var p=k.lastIndexOf('.');
      var par=p>0?map[k.slice(0,p)]:null;
      if(par) par.kids.push(map[k]); else roots.push(map[k]); });
    return roots; }
  function elementsTree(host,slideIdx){
    var sec0=deckEl().querySelectorAll('.slide')[slideIdx]; if(!sec0) return;
    var wrap=el('div','forge-tree');
    var selKey=(F.sel&&F.sel.slideIdx===slideIdx)?(F.sel.key||F.sel.id):null;
    function row(entry,depth){
      var node=entry.node, kids=entry.kids;
      var key=node.getAttribute('data-el')||node.getAttribute('data-free');
      var openKey=slideIdx+':'+key, isOpen=F._treeOpen[openKey]!==false;
      var r=el('div','forge-tree-row'+(selKey===key?' cur':''));
      r.style.paddingLeft=(6+depth*14)+'px';
      var tg=el('span','forge-tree-tg',kids.length?(isOpen?'▾':'▸'):'·');
      if(kids.length) tg.onclick=function(e){ e.stopPropagation(); F._treeOpen[openKey]=!isOpen; F.buildInspect(); };
      r.appendChild(tg);
      var lb=el('span','forge-tree-lb'); lb.textContent=treeLabel(node); r.appendChild(lb);
      var tools=el('span','tools');
      if(!node.hasAttribute('data-free')){
        if(node.getAttribute('data-arr'))
          treeChip(tools,'＋','Add item (matches this list\u2019s shape)',function(){ F.addItem(slideIdx,node); });
        var it=itemOf(key);
        if(it&&key===it.path+'.'+it.idx&&contentArr(slideIdx,it.path)){
          treeChip(tools,'⧉','Duplicate item',function(){ F.dupItem(slideIdx,node); });
          treeChip(tools,'✕','Remove item',function(){ F.removeItem(slideIdx,node); },true); } }
      else treeChip(tools,'✕','Delete object',function(){ selectNode(node,false); F.deleteSel(); },true);
      r.appendChild(tools);
      r.onclick=function(){ selectNode(node,false); };
      wrap.appendChild(r);
      if(isOpen) kids.forEach(function(ch){ row(ch,depth+1); }); }
    keyedTree(sec0).forEach(function(entry){ row(entry,0); });
    [].slice.call(sec0.querySelectorAll('.forge-free')).forEach(function(fn){ row({node:fn,kids:[]},0); });
    host.appendChild(wrap); }

  /* =====================================================================
     ASSET LIBRARY (media plan §2.5) — grid of every imported image/svg
     diagram: import, insert into the current slide, rename (remaps every
     reference), replace file, delete (undoable), and "link instead of
     embed" (media plan §7.3). The size meter is informational only — it
     never blocks an import.
     ===================================================================== */
  function fmtBytes(n){ if(!n) return '0 KB'; if(n>=1024*1024) return (n/1024/1024).toFixed(1)+' MB'; return Math.max(1,Math.round(n/1024))+' KB'; }
  F.assetsPanel=function(){
    var old=D.getElementById('forge-assets'); if(old){ old.remove(); return; }
    if(!F.assets){ return; }                              /* media.js not loaded */
    var o=el('div','forge-chrome'); o.id='forge-assets';
    var card=el('div','forge-assets-card');
    var head=el('div','forge-assets-head'); head.appendChild(el('h3',null,'Assets'));
    var fileInp=el('input'); fileInp.type='file'; fileInp.accept='image/*,.svg'; fileInp.multiple=true; fileInp.hidden=true;
    var imp=el('button','forge-btn primary','＋ Import'); imp.onclick=function(){ fileInp.click(); };
    fileInp.onchange=function(){ var files=[].slice.call(fileInp.files||[]); fileInp.value=''; if(!files.length) return;
      Promise.all(files.map(function(f){ return F.assets.importFile(f).catch(function(err){
        try{ console.warn('slide-forge: import failed for '+f.name,err); }catch(e){} return null; }); }))
        .then(function(){ renderGrid(); F.save(); }); };
    head.appendChild(imp); head.appendChild(fileInp);
    var closeBtn=el('button','forge-btn','Close'); closeBtn.onclick=function(){ o.remove(); }; head.appendChild(closeBtn);
    card.appendChild(head);
    var undoBar=el('div','forge-assets-undo'); undoBar.style.display='none'; card.appendChild(undoBar);
    var grid=el('div','forge-assets-grid'); card.appendChild(grid);
    var meter=el('div','forge-assets-meter'); card.appendChild(meter);
    var dz=el('div','forge-assets-dropzone','Drop images or .svg diagrams here');
    card.appendChild(dz);
    ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add('over'); }); });
    ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove('over'); }); });
    dz.addEventListener('drop',function(e){ var files=[].slice.call((e.dataTransfer&&e.dataTransfer.files)||[]); if(!files.length) return;
      Promise.all(files.map(function(f){ return F.assets.importFile(f).catch(function(){ return null; }); }))
        .then(function(){ renderGrid(); F.save(); }); });

    function showUndoBar(name){ undoBar.innerHTML=''; undoBar.style.display='flex';
      undoBar.appendChild(el('span',null,'Deleted "'+name+'".'));
      var u=el('button','forge-chip','Undo'); u.onclick=function(){ F.assets.undoRemove(); F.save(); renderGrid(); };
      undoBar.appendChild(u);
      clearTimeout(F._assetsUndoT); F._assetsUndoT=setTimeout(function(){ undoBar.style.display='none'; },6000); }

    function toggleLinkForm(cardEl,name){
      var existing=cardEl.querySelector('.forge-asset-linkform'); if(existing){ existing.remove(); return; }
      var entry=(SG.assets.images||{})[name]; var ext=((entry&&entry.type)||'image/png').split('/')[1]||'png';
      var form=el('div','forge-asset-linkform');
      form.appendChild(el('div','forge-hint','Converts this asset to a relative-path reference instead of embedding it. The browser will download the original file — save it at this path next to the deck.'));
      var inp=el('input'); inp.type='text'; inp.value='assets/images/'+name+'.'+ext; form.appendChild(inp);
      var row=el('div','forge-asset-linkform-btns');
      var ok=el('button','forge-btn primary','Convert + download'); var cancel=el('button','forge-btn','Cancel');
      cancel.onclick=function(){ form.remove(); };
      ok.onclick=function(){ var blobSrc=F.assets.linkAsset(name,inp.value);
        if(blobSrc){ var a=el('a'); a.href=blobSrc; a.download=name+'.'+ext; D.body.appendChild(a); a.click(); a.remove(); }
        F.save(); renderGrid(); };
      row.appendChild(ok); row.appendChild(cancel); form.appendChild(row); cardEl.appendChild(form); }

    function assetCard(name,kind){
      var entry=kind==='image'?(SG.assets.images||{})[name]:null;
      var isLinked=entry&&typeof entry==='object'&&entry.store==='linked';
      var c=el('div','forge-asset-card');
      var thumb=el('div','forge-asset-thumb');
      if(kind==='svg'){ thumb.innerHTML=SG.svgMarkup(name)||''; }
      else { var m=SG.imageMeta(name); var img=el('img'); img.alt=m.alt||name; img.loading='lazy'; if(m.src) img.src=m.src; thumb.appendChild(img); }
      c.appendChild(thumb);
      var meta=el('div','forge-asset-meta');
      var nameRow=el('div','forge-asset-name');
      var nameInp=el('input'); nameInp.type='text'; nameInp.value=name; nameInp.className='forge-asset-rename';
      nameInp.onchange=function(){ if(nameInp.value&&nameInp.value!==name){ F.assets.rename(name,nameInp.value); F.save(); renderGrid(); } };
      nameRow.appendChild(nameInp);
      nameRow.appendChild(el('span','forge-asset-badge'+(isLinked?' linked':''),kind==='svg'?'diagram':(isLinked?'linked':'embedded')));
      meta.appendChild(nameRow);
      if(kind==='image'&&entry&&typeof entry==='object'){
        var dims=entry.w&&entry.h?(entry.w+'×'+entry.h):'', weight=entry.bytes?fmtBytes(entry.bytes):'';
        meta.appendChild(el('div','forge-asset-sub',[dims,weight].filter(Boolean).join(' · ')));
        var altInp=el('input'); altInp.type='text'; altInp.placeholder='Alt text'; altInp.value=entry.alt||'';
        altInp.onchange=function(){ entry.alt=altInp.value; F.assets.saveDebounced(); };
        meta.appendChild(altInp);
      }
      c.appendChild(meta);
      var actions=el('div','forge-asset-actions');
      function abtn(lab,fn,cls){ var b=el('button','forge-chip'+(cls?' '+cls:''),lab); b.onclick=fn; actions.appendChild(b); return b; }
      abtn('＋ Insert',function(){ F.addImage(name,kind); o.remove(); });
      if(kind==='image'){
        var repl=el('input'); repl.type='file'; repl.accept='image/*'; repl.hidden=true;
        repl.onchange=function(){ var f=repl.files&&repl.files[0]; repl.value=''; if(!f) return;
          F.assets.replaceFile(name,f).then(function(){ F.save(); renderGrid(); }); };
        abtn('⭯ Replace',function(){ repl.click(); }); actions.appendChild(repl);
        if(!isLinked) abtn('🔗 Link',function(){ toggleLinkForm(c,name); });
      }
      abtn('🗑 Delete',function(){ F.assets.remove(name); F.save(); renderGrid(); showUndoBar(name); },'warn');
      c.appendChild(actions);
      return c; }

    function renderMeter(){ var count=F.assets.count(), bytes=F.assets.bytes();
      meter.className='forge-assets-meter'+(bytes>20*1024*1024?' hot':bytes>8*1024*1024?' warm':'');
      meter.textContent=count+' asset'+(count===1?'':'s')+' · '+fmtBytes(bytes);
      if(bytes>8*1024*1024) meter.appendChild(el('span',null,' — large decks can exceed email attachment limits; consider "Link instead of embed".')); }

    function renderGrid(){ grid.innerHTML='';
      var names=Object.keys(SG.assets.images||{}).sort(), svgNames=Object.keys(SG.assets.svg||{}).sort();
      if(!names.length&&!svgNames.length) grid.appendChild(el('div','forge-hint','No assets yet — Import an image or SVG diagram, or drop files below.'));
      names.forEach(function(n){ grid.appendChild(assetCard(n,'image')); });
      svgNames.forEach(function(n){ grid.appendChild(assetCard(n,'svg')); });
      renderMeter(); }
    renderGrid();
    o.appendChild(card);
    D.body.appendChild(o);
    o.addEventListener('pointerdown',function(e){ if(e.target===o) o.remove(); }); };

      else { ta.select(); try{ D.execCommand('copy'); }catch(e){} done(); } });

      if(!SG.layouts[parsed.layout]){ msg.textContent='✗ Unknown layout "'+parsed.layout+'"'; msg.style.color='#f0a0a0'; return; }

    var deck=root.querySelector('#deck'); if(deck){ deck.innerHTML=''; deck.removeAttribute('style'); }
    if(F.assets) F.assets.gc();                 /* drop unreferenced assets before shipping the file (media plan §2.3) */
    var dataEl=root.querySelector('#deck-data'); if(dataEl) dataEl.textContent='\n'+JSON.stringify(SG.data,null,2)+'\n';
    var asEl=root.querySelector('#deck-assets'); if(asEl) asEl.textContent='\n'+JSON.stringify(SG.assets||{icons:{},images:{},svg:{},styles:''})+'\n';
    var t=root.querySelector('title'); if(t&&SG.data.meta&&SG.data.meta.title) t.textContent=SG.data.meta.title;
    return '<!doctype html>\n'+root.outerHTML; }
  function deckFilename(){ return ((SG.data.meta&&SG.data.meta.title)||'deck').replace(/[^\w.-]+/g,'-').toLowerCase()+'.html'; }
  F.downloadBlob=function(html){ var blob=new Blob([html],{type:'text/html'});
    var a=D.createElement('a'); a.href=URL.createObjectURL(blob); a.download=deckFilename();
    D.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000); };
  function savedFlash(msg){ var b=F._saveBtn; if(!b) return; var t0=b.textContent;
    b.textContent=msg||'\u2713 Saved'; b.disabled=true;
    setTimeout(function(){ b.textContent=t0; b.disabled=false; },1400); }
  /* Save: writes IN PLACE via the File System Access API where available
     (Chrome/Edge; first save picks the file, later saves are silent), else
     falls back to downloading a fresh copy. */
  F._fileHandle=null;
  F.download=function(){ var html=currentHTML();
    if(W.showSaveFilePicker){
      var p=F._fileHandle?Promise.resolve(F._fileHandle)
        :W.showSaveFilePicker({suggestedName:deckFilename(),types:[{description:'HTML deck',accept:{'text/html':['.html']}}]})
          .then(function(h){ F._fileHandle=h; return h; });
      p.then(function(h){ return h.createWritable(); })
       .then(function(ws){ return ws.write(html).then(function(){ return ws.close(); }); })
       .then(function(){ savedFlash(); })
       .catch(function(err){ if(err&&err.name==='AbortError') return; F.downloadBlob(html); });
    } else F.downloadBlob(html); };

  /* =====================================================================
     RESTORE BAR — offer to restore newer autosaved edits from localStorage.
     ===================================================================== */
  function checkRestore(){ var saved=null;
    try{ saved=localStorage.getItem(F.key()); }catch(e){}
    if(!saved||saved===JSON.stringify(SG.data)) return;
    var rb=D.getElementById('forge-restore'); if(!rb) return;
    rb.innerHTML='<span>Unsaved edits from a previous session found.</span>';
    var yes=el('button','forge-btn primary','Restore'), no=el('button','forge-btn','Discard');
    yes.onclick=function(){ try{ SG.data=SG.migrate(JSON.parse(saved)); }catch(e){}
      SG.render(deckEl(),SG.data); SG.refresh&&SG.refresh(); F.buildNav(); F.buildInspect(); rb.style.display='none'; };
    no.onclick=function(){ try{ localStorage.removeItem(F.key()); }catch(e){} rb.style.display='none'; };
    rb.appendChild(yes); rb.appendChild(no); rb.style.display='flex'; }

  /* =====================================================================
     TOGGLE + BOOT
     ===================================================================== */
  F.showKeys=function(){ var o=D.getElementById('forge-keys');
    if(o){ o.style.display=o.style.display==='none'?'flex':'none'; return; }
    o=el('div','forge-chrome'); o.id='forge-keys';
    var rows=[['Drag / Alt','Move with snap guides / snap off'],
      ['Drag corner / Alt+corner','Resize width \u2014 text reflows / scale'],['Double-click','Edit text in place'],
      ['Shift-click / marquee','Multi-select'],['Ctrl+C · V · D','Copy / paste / duplicate (deep)'],
      ['Ctrl+G / Ctrl+Shift+G','Group / ungroup'],['Arrows / Shift+arrows','Nudge 1px / 10px'],
      ['Delete','Delete / reset selection'],['Ctrl+Z / Ctrl+Shift+Z','Undo / redo'],
      ['Ctrl+S','Save (in place on Chrome/Edge)'],['Esc','Clear selection / close'],
      ['— presenting —',''],['\u2192 / Space / click','Next build step, then next slide'],
      ['F / S / P','Fullscreen / speaker view / PDF'],['?','This overlay']];
    var body='<div class="forge-hints-card"><h3>Keyboard shortcuts</h3><table class="forge-keys-tbl">';
    rows.forEach(function(r){ body+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
    body+='</table><button class="forge-btn primary" id="forge-keys-ok">Close</button></div>';
    o.innerHTML=body; D.body.appendChild(o);
    o.querySelector('#forge-keys-ok').onclick=function(){ o.style.display='none'; };
    o.style.display='flex'; };
  F.showHints=function(force){
    try{ if(!force&&localStorage.getItem('forge:hints-seen')) return; }catch(e){}
    var o=D.getElementById('forge-hints');
    if(!o){ o=el('div','forge-chrome'); o.id='forge-hints';
      o.innerHTML='<div class="forge-hints-card"><h3>Editing basics</h3><ul>'
        +'<li><b>Drag</b> any element \u2014 pink guides snap it to centers and edges (hold <b>Alt</b> for free placement)</li>'
        +'<li><b>Double-click</b> text to rewrite it in place</li>'
        +'<li><b>Shift-click</b> or drag a box to select several \u2014 align from the floating toolbar, <b>Ctrl+G</b> groups them</li>'
        +'<li>The <b>right panel</b> edits text and structure; the <b>left panel</b> reorders slides (\u25a6 = sorter view)</li>'
        +'<li><b>Ctrl+S</b> saves your copy \u00b7 add notes per slide and press <b>S</b> while presenting for the speaker view</li>'
        +'</ul><button class="forge-btn primary" id="forge-hints-ok">Got it</button></div>';
      D.body.appendChild(o);
      o.querySelector('#forge-hints-ok').onclick=function(){ o.style.display='none';
        try{ localStorage.setItem('forge:hints-seen','1'); }catch(e){} }; }
    o.style.display='flex'; };
  F.toggle=function(){ var on=D.body.classList.toggle('forge-edit');
    if(F._launch) F._launch.textContent=on?'\u2713 Done':'\u270e Edit';
    if(F.editing) endEdit(); clearSel(); hideCtxMenu();
    if(on){ SG.render(deckEl(),SG.data); SG.refresh&&SG.refresh(); F.buildNav(); F.buildInspect(); F.showHints(); }
    else { SG.render(deckEl(),SG.data); SG.refresh&&SG.refresh(); if(floatBar) floatBar.classList.remove('on'); }
  };

  function boot(){ SG.boot();
    if(!SG.data) return;                     /* engine showed the JSON-error slide */
    /* merge back any autosaved assets BEFORE the deck-JSON restore prompt, so
       a restored deck that references an imported image finds it (media plan
       §2.3) — additive only, never overwrites what the saved .html shipped with */
    if(F.assets) F.assets.restore();
    F.buildChrome(); wireDeck(); wireKeys();
    F.buildNav(); F.buildInspect(); checkRestore();
    W.addEventListener('hashchange',function(){ clearSel(); F.buildNav(); F.buildInspect(); });
  }
  if(document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded',boot);

  /* observe selection changes to keep the floating toolbar in sync */
  var _paint=paintSel; paintSel=function(){ _paint(); buildFloat(); };
  /* re-wrap: selectNode/selectNodes/clearSel captured paintSel by reference at
     definition time inside this closure, so re-binding the name above is enough. */
})();
</script>
<script id="forge-media">
/* =====================================================================
   MEDIA — asset store v2: browser-side import, SVG sanitizer, dedupe,
   reference-scan GC, size accounting. (media plan §2). Additive: a deck
   with no imported assets behaves exactly as before — SG.imageMeta/
   imageURL (engine.js) already fall back to the legacy plain-string shape.

   Registry lives in SG.assets, NOT SG.data (media plan §2.3): imports are
   append-mostly and deliberately OUTSIDE undo/autosave snapshotting (undo
   stringifies the whole deck per gesture — doing that with megabytes of
   base64 would make every keystroke O(deck size)). Only asset DELETION goes
   through a small side undo stack (F.assets._trash). Orphaned entries cost
   nothing until Save, when gc() removes them — logged, never silent.

   Storage rule (media plan §7.3): generation-time assets (assets.py) are
   ALWAYS store:"embedded", no size ceiling. Editor imports embed by default,
   downscaled; the library panel (editor.js) offers "link instead of embed"
   for a relative-path alternative when a deck+folder pair is preferred over
   one large file.
   ===================================================================== */
(function(){
  var W=window, D=document, SG=W.SG=W.SG||{};
  var F=W.Forge=W.Forge||{};
  F.assets=F.assets||{};

  var MAX_EDGE=1920, WEBP_Q=0.86;

  function uid(){ return 'a'+Math.random().toString(36).slice(2,9); }
  function extOf(name){ var m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
  function baseName(name){ return String(name||'asset').replace(/\.[^.]+$/,'')
    .replace(/[^\w-]+/g,'-').toLowerCase().slice(0,40)||'asset'; }
  function uniqueName(base){ var reg=SG.assets.images||{}, svgReg=SG.assets.svg||{}, n=base, i=1;
    while(reg[n]||svgReg[n]){ n=base+'-'+(++i); } return n; }

  /* cheap content hash (FNV-1a over the base64 payload) for dedupe — not
     cryptographic, just enough to catch "the user dropped the same file twice" */
  function fnv1a(s){ var h=0x811c9dc5;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
    return (h>>>0).toString(36); }
  F.assets._hashes=F.assets._hashes||{};              /* hash -> registry name */

  F.assets.dedupe=function(dataURI){
    var h=fnv1a(dataURI), existing=F.assets._hashes[h];
    return (existing && (SG.assets.images||{})[existing]) ? existing : null; };
  function registerHash(dataURI,name){ F.assets._hashes[fnv1a(dataURI)]=name; }

  /* ---------- raster import: decode -> optionally downscale -> re-encode ---------- */
  function readAsDataURL(file){ return new Promise(function(res,rej){
    var fr=new FileReader(); fr.onload=function(){ res(fr.result); }; fr.onerror=function(){ rej(fr.error); };
    fr.readAsDataURL(file); }); }
  function loadImageEl(src){ return new Promise(function(res,rej){
    var img=new Image(); img.onload=function(){ res(img); }; img.onerror=function(){ rej(new Error('could not decode image')); };
    img.src=src; }); }
  function downscale(img,maxEdge){
    var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    var s=Math.min(1,maxEdge/Math.max(w,h));
    var tw=Math.max(1,Math.round(w*s)), th=Math.max(1,Math.round(h*s));
    var cv=D.createElement('canvas'); cv.width=tw; cv.height=th;
    cv.getContext('2d').drawImage(img,0,0,tw,th);
    return {canvas:cv,w:tw,h:th}; }

  /* Import a raster/SVG File into the registry.
     opts.keepOriginal — skip downscale/re-encode (editor-import knob; NOT
       used by generation-time assets, which never downscale in the first
       place — see scripts/assets.py).
     opts.name — force the registry key (used by replaceFile). */
  F.assets.importFile=function(file,opts){
    opts=opts||{};
    var ext=extOf(file.name), isSVG=(ext==='svg'||file.type==='image/svg+xml');
    var name=opts.name||uniqueName(baseName(file.name)||uid());
    if(isSVG){
      return file.text().then(function(text){
        var san=F.assets.sanitizeSVG(text,name);
        SG.assets.svg=SG.assets.svg||{}; SG.assets.svg[name]=san.markup;
        F.assets.saveDebounced&&F.assets.saveDebounced();
        return {name:name,kind:'svg',w:san.w,h:san.h}; });
    }
    return readAsDataURL(file).then(function(rawURI){
      var dup=!opts.keepOriginal && F.assets.dedupe(rawURI);
      if(dup) return {name:dup,kind:'image',reused:true};
      return loadImageEl(rawURI).then(function(img){
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height,
            src=rawURI, type=file.type||'image/png', bytes=file.size,
            animated=(ext==='gif');                    /* never re-encode: would drop animation */
        if(!opts.keepOriginal && !animated && Math.max(w,h)>MAX_EDGE){
          var ds=downscale(img,MAX_EDGE);
          try{ src=ds.canvas.toDataURL('image/webp',WEBP_Q); type='image/webp'; }
          catch(e){ src=ds.canvas.toDataURL(type); }
          w=ds.w; h=ds.h; bytes=Math.round(src.length*0.75);
        }
        registerHash(src,name);
        SG.assets.images=SG.assets.images||{};
        SG.assets.images[name]={store:'embedded',src:src,w:w,h:h,bytes:bytes,type:type,alt:'',origin:'import'};
        F.assets.saveDebounced&&F.assets.saveDebounced();
        return {name:name,kind:'image'}; });
    }); };

  /* ---------- SVG sanitizer (DOMParser allow-list; mirrors scripts/assets.py's
     regex sanitizer, but structural since a live DOM is available here) ---------- */
  F.assets.sanitizeSVG=function(text,ns){
    var w=0,h=0;
    try{
      var doc=new DOMParser().parseFromString(text,'image/svg+xml');
      if(doc.querySelector('parsererror')) throw new Error('invalid SVG');
      var svg=doc.documentElement;
      if(!svg||svg.nodeName.toLowerCase()!=='svg') throw new Error('not an <svg> root');
      var vb=svg.getAttribute('viewBox');
      w=parseFloat(svg.getAttribute('width'))||0; h=parseFloat(svg.getAttribute('height'))||0;
      if((!w||!h)&&vb){ var p=vb.split(/[\s,]+/); w=w||parseFloat(p[2])||0; h=h||parseFloat(p[3])||0; }
      ['script','foreignObject'].forEach(function(tag){
        [].slice.call(svg.getElementsByTagName(tag)).forEach(function(n){ n.parentNode&&n.parentNode.removeChild(n); }); });
      var all=[svg].concat([].slice.call(svg.getElementsByTagName('*')));
      all.forEach(function(n){
        [].slice.call(n.attributes||[]).forEach(function(a){
          var an=a.name.toLowerCase();
          if(/^on/.test(an)){ n.removeAttribute(a.name); return; }
          if((an==='href'||an==='xlink:href')&&a.value&&a.value.charAt(0)!=='#'&&!/^data:image\//i.test(a.value)){
            n.removeAttribute(a.name); } }); });
      /* namespace fragment IDs so two imported diagrams never collide */
      var pre='sf-'+(ns||uid())+'-', idMap={};
      all.forEach(function(n){ var id=n.getAttribute('id'); if(id){ idMap[id]=pre+id; n.setAttribute('id',pre+id); } });
      if(Object.keys(idMap).length){ all.forEach(function(n){
        [].slice.call(n.attributes||[]).forEach(function(a){
          var v=a.value, changed=false;
          Object.keys(idMap).forEach(function(old){
            var re=new RegExp('url\\(#'+old+'\\)','g');
            if(re.test(v)){ v=v.replace(re,'url(#'+idMap[old]+')'); changed=true; }
            if(v==='#'+old){ v='#'+idMap[old]; changed=true; } });
          if(changed) n.setAttribute(a.name,v); }); }); }
      return {markup:new XMLSerializer().serializeToString(svg),w:w,h:h};
    }catch(e){
      return {markup:'<svg viewBox="0 0 100 100"><text x="8" y="55" font-size="9">invalid SVG</text></svg>',w:100,h:100};
    } };

  /* ---------- reference scan: every place an asset NAME can appear ----------
     layout content: {image:"name"}, {poster:"name"}, {svg:"name"} (diagram
     layout), brand.logo. Free objects: {type:"image"|"svg", asset:"name"}.
     Kept in one place so gc() and the library panel agree on what "used"
     means, and so scripts/assets.py's Python walker (extended in Phase C)
     stays in lockstep by convention (same key names, same rules). */
  F.assets.refs=function(){
    var used={images:{},svg:{}};
    function noteImage(v){ if(typeof v==='string'&&v) used.images[v]=1; }
    function noteSvg(v){ if(typeof v==='string'&&v) used.svg[v]=1; }
    (function walk(o){
      if(o==null||typeof o!=='object') return;
      if(Array.isArray(o)){ o.forEach(walk); return; }
      Object.keys(o).forEach(function(k){
        var v=o[k];
        if(k==='image'||k==='poster'||k==='logo') noteImage(v);
        else if(k==='svg'&&typeof v==='string') noteSvg(v);          /* diagram layout content */
        else if(k==='asset'){ if(o.type==='svg') noteSvg(v); else noteImage(v); }
        else walk(v); }); })(SG.data);
    return used; };

  /* ---------- GC (runs on Save; never silent mid-session) ---------- */
  F.assets.gc=function(opts){ opts=opts||{};
    var used=F.assets.refs(), dropped=[];
    var imgs=SG.assets.images||{}, svgs=SG.assets.svg||{};
    Object.keys(imgs).forEach(function(n){ if(!used.images[n]){ if(!opts.dryRun) delete imgs[n]; dropped.push('image:'+n); } });
    Object.keys(svgs).forEach(function(n){ if(!used.svg[n]){ if(!opts.dryRun) delete svgs[n]; dropped.push('svg:'+n); } });
    if(dropped.length&&!opts.dryRun) try{ console.info('slide-forge: gc removed unreferenced asset(s) — '+dropped.join(', ')); }catch(e){}
    return dropped; };

  /* ---------- accounting (informational meter, never a gate — media plan §7.3) ---------- */
  F.assets.bytes=function(){ var t=0;
    var imgs=SG.assets.images||{}; Object.keys(imgs).forEach(function(n){ var e=imgs[n]; if(e&&typeof e==='object') t+=e.bytes||0; });
    var svgs=SG.assets.svg||{}; Object.keys(svgs).forEach(function(n){ t+=(svgs[n]||'').length; });
    return t; };
  F.assets.count=function(){ return Object.keys(SG.assets.images||{}).length + Object.keys(SG.assets.svg||{}).length; };

  /* ---------- library ops: rename / replace / remove(+undo) / link<->embed ---------- */
  F.assets._trash=[];
  F.assets.rename=function(oldName,newName){
    newName=uniqueName(baseName(newName));
    var imgs=SG.assets.images||{}, svgs=SG.assets.svg||{};
    if(imgs[oldName]){ imgs[newName]=imgs[oldName]; delete imgs[oldName]; F.assets._remapRefs(oldName,newName,'image'); }
    else if(svgs[oldName]){ svgs[newName]=svgs[oldName]; delete svgs[oldName]; F.assets._remapRefs(oldName,newName,'svg'); }
    F.assets.saveDebounced&&F.assets.saveDebounced();
    return newName; };
  /* rewrite every reference to a renamed asset so a rename never orphans the
     objects that used it */
  F.assets._remapRefs=function(oldName,newName,kind){
    (function walk(o){ if(o==null||typeof o!=='object') return;
      if(Array.isArray(o)){ o.forEach(walk); return; }
      Object.keys(o).forEach(function(k){
        var v=o[k];
        if((k==='image'||k==='poster'||k==='logo')&&v===oldName&&kind==='image') o[k]=newName;
        else if(k==='svg'&&typeof v==='string'&&v===oldName&&kind==='svg') o[k]=newName;
        else if(k==='asset'&&v===oldName&&((kind==='svg')===(o.type==='svg'))) o[k]=newName;
        else walk(v); }); })(SG.data); };
  F.assets.replaceFile=function(name,file){
    var tmp='__tmp_'+uid();
    return F.assets.importFile(file,{name:tmp,keepOriginal:true}).then(function(res){
      var imgs=SG.assets.images||{}, svgs=SG.assets.svg||{};
      if(res.kind==='image'){ imgs[name]=imgs[tmp]; delete imgs[tmp]; if(svgs[name]) delete svgs[name]; }
      else { svgs[name]=svgs[tmp]; delete svgs[tmp]; if(imgs[name]) delete imgs[name]; }
      F.assets.saveDebounced&&F.assets.saveDebounced();
      return name; }); };
  F.assets.remove=function(name){
    var imgs=SG.assets.images||{}, svgs=SG.assets.svg||{};
    if(imgs[name]){ F.assets._trash.push({name:name,kind:'image',entry:imgs[name]}); delete imgs[name]; }
    else if(svgs[name]){ F.assets._trash.push({name:name,kind:'svg',entry:svgs[name]}); delete svgs[name]; }
    F.assets.saveDebounced&&F.assets.saveDebounced(); };
  F.assets.undoRemove=function(){ var t=F.assets._trash.pop(); if(!t) return null;
    if(t.kind==='image'){ SG.assets.images=SG.assets.images||{}; SG.assets.images[t.name]=t.entry; }
    else { SG.assets.svg=SG.assets.svg||{}; SG.assets.svg[t.name]=t.entry; }
    F.assets.saveDebounced&&F.assets.saveDebounced();
    return t.name; };
  /* "Link instead of embed" (media plan §7.3): converts an embedded image to
     store:"linked" at a relative path and hands back the original bytes so
     the caller can offer them as a download — the browser can't write into
     an arbitrary folder on its own, so placing the file next to the deck is
     the one manual step in an otherwise all-in-editor workflow. */
  F.assets.linkAsset=function(name,relPath){
    var imgs=SG.assets.images||{}, e=imgs[name]; if(!e||typeof e!=='object'||e.store==='linked') return null;
    var blobSrc=e.src;
    imgs[name]={store:'linked',path:relPath,w:e.w,h:e.h,bytes:e.bytes,type:e.type,alt:e.alt||''};
    F.assets.saveDebounced&&F.assets.saveDebounced();
    return blobSrc; };
  F.assets.embedAsset=function(name,dataURI,meta){
    var imgs=SG.assets.images||{}, e=imgs[name]; if(!e) return;
    imgs[name]={store:'embedded',src:dataURI,w:(meta&&meta.w)||e.w,h:(meta&&meta.h)||e.h,
      bytes:(meta&&meta.bytes)||e.bytes,type:(meta&&meta.type)||e.type,alt:e.alt||''};
    F.assets.saveDebounced&&F.assets.saveDebounced(); };
  F.assets.downloadAsset=function(name){
    var e=(SG.assets.images||{})[name]; if(!e||typeof e!=='object'||!e.src) return;
    var ext=(e.type||'').split('/')[1]||'png';
    var a=D.createElement('a'); a.href=e.src; a.download=name+'.'+ext;
    D.body.appendChild(a); a.click(); a.remove(); };

  /* ---------- persistence: assets get their OWN localStorage key, written on
     a longer debounce than deck JSON, so an oversized registry can never cost
     the user their text edits (F.save() for deck JSON always runs first —
     media plan §2.3). QuotaExceededError is caught and surfaced, never
     swallowed: F.assets._unsaved flags it for the chrome layer to show. ---------- */
  F.assets.storageKey=function(){ return F.key()+':assets'; };
  F.assets._unsaved=false;
  F.assets.save=function(){
    try{ localStorage.setItem(F.assets.storageKey(), JSON.stringify({images:SG.assets.images||{},svg:SG.assets.svg||{}}));
      if(F.assets._unsaved){ F.assets._unsaved=false; F.assets._onSaveState&&F.assets._onSaveState(false); }
    }catch(e){ if(!F.assets._unsaved){ F.assets._unsaved=true; F.assets._onSaveState&&F.assets._onSaveState(true); } } };
  F.assets.saveDebounced=function(){ clearTimeout(F.assets._saveT); F.assets._saveT=setTimeout(F.assets.save,900); };
  F.assets.restore=function(){
    try{ var raw=localStorage.getItem(F.assets.storageKey()); if(!raw) return false;
      var parsed=JSON.parse(raw);
      SG.assets.images=Object.assign({},parsed.images||{},SG.assets.images||{});
      SG.assets.svg=Object.assign({},parsed.svg||{},SG.assets.svg||{});
      return true;
    }catch(e){ return false; } };
})();
</script>
