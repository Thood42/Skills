<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Machines Learn — a visual primer</title>

<!-- Libraries this deck uses (vendored locally). bundle.py reads this list to
     stage/inline only what's referenced. Leave empty if the deck is pure-bespoke. -->
<meta name="deck-libs" content="">

<script>
/* =====================================================================
   SG — slide globals: deterministic-render flag, seeded RNG, lazy lib loader.
   Defined FIRST so every later script (bespoke runtime, chart/3D snippets,
   library integrations) can rely on it. Why this exists:

   - Reproducibility. Library visuals (Chart.js, Three.js, GSAP) animate via
     requestAnimationFrame, which the headless renderer freezes at an arbitrary
     mid-frame, so two captures of the "same" deck differ. SG.static lets every
     integration JUMP TO ITS FINISHED STATE during capture while the LIVE deck
     still animates for the audience. The renderer sets <html data-static>.
   - Determinism. Anything generative (particles, jitter, demo data) must draw
     from SG.rng (a seeded PRNG), never bare Math.random(), so the same deck
     renders the same pixels every time. Set the seed via <html data-seed="N">.
   - On-demand libs. SG.loadLib(name) injects a vendored script only when needed
     (e.g. heavy Three.js on the one slide that uses it).
   ===================================================================== */
(function(){
  var W = window, SG = W.SG = W.SG || {};
  var root = document.documentElement;

  /* Static (frozen, final-state) capture mode: renderer sets data-static; also
     honoured for ?static and reduced-motion users so they see finished visuals. */
  SG.static = root.hasAttribute('data-static')
    || /[?&]static(?:=1|\b)/.test(location.search)
    || matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Seeded PRNG (mulberry32). SG.makeRng(seed) gives an independent stream;
     SG.rng is the deck-wide default seeded from <html data-seed> (fallback 1). */
  SG.makeRng = function(seed){
    var a = (seed>>>0) || 1;
    return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  };
  SG.rng = SG.makeRng(parseInt(root.getAttribute('data-seed')||'1',10));

  /* Registry of vendored libs, name -> {src, global?, type?}. Paths are relative
     to the deck (libs are staged into ./lib/ by bundle.py). UMD libs are usually
     just <script src="lib/..."> tags in <head>; loadLib is for lazy/ESM ones. */
  SG.libs = SG.libs || {
    chartjs:  { src:'lib/chartjs/chart.umd.min.js',     global:'Chart',   type:'umd' },
    mermaid:  { src:'lib/mermaid/mermaid.min.js',       global:'mermaid', type:'umd' },
    katex:    { src:'lib/katex/katex.min.js',           global:'katex',   type:'umd' },
    gsap:     { src:'lib/gsap/gsap.min.js',             global:'gsap',    type:'umd' },
    highlight:{ src:'lib/highlight/highlight.min.js',   global:'hljs',    type:'umd' },
    three:    { src:'lib/three/three.module.min.js',                      type:'esm' }
  };
  SG.loadScript = function(src){ return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=false;
    s.onload=function(){res();}; s.onerror=function(){rej(new Error('failed to load '+src));};
    document.head.appendChild(s); }); };
  SG.loadLib = function(name){
    var spec = SG.libs[name];
    if(!spec) return Promise.reject(new Error('unknown lib: '+name));
    if(spec.global && W[spec.global]) return Promise.resolve(W[spec.global]);
    if(spec.type==='esm') return import(spec.src);
    return SG.loadScript(spec.src).then(function(){ return spec.global?W[spec.global]:undefined; });
  };

  /* Lets the renderer know all on-enter / async work has settled (mermaid SVG,
     loaded libs, count-ups). Snippets call SG.ready(promise) to register work;
     render.sh waits for window.__SG_READY before screenshotting in static mode. */
  SG._pending = [];
  SG.ready = function(p){ if(p&&p.then) SG._pending.push(p); };
  W.addEventListener('load', function(){
    Promise.all(SG._pending).then(function(){ W.__SG_READY = true; })
                            .catch(function(){ W.__SG_READY = true; });
  });
})();
</script>

<!--
  =====================================================================
  /slides reference deck  —  self-contained HTML presentation
  ---------------------------------------------------------------------
  • One file. Open in any browser. Arrow keys / Space to navigate.
  • 12 varied layouts (cover, agenda, divider, stat grid, big number,
    chart, comparison, quote, code, timeline, pipeline, closing).
  • One subtle ambient animation per slide (CSS only, motion-safe).
  • Theme via the CSS variables in :root. Fonts via CDN with sturdy
    local fallbacks so it still renders offline.
  • Per-slide deep links: deck.html#7 opens slide 7 (used for PNG render).
  =====================================================================
-->

<!-- Fonts: CDN with installed fallbacks (DejaVu) so offline render still works -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================ THEME ============================ */
:root{
  --bg:        #05080f;
  --bg-2:      #0a1122;
  --ink:       #eaf1fb;
  --muted:     #93a2bd;
  --faint:     #5a6a86;
  --cyan:      #3ce8ff;
  --indigo:    #7c8cff;
  --mint:      #44f3c4;
  --panel:     rgba(255,255,255,.040);
  --panel-2:   rgba(255,255,255,.065);
  --brd:       rgba(255,255,255,.10);
  --brd-2:     rgba(124,140,255,.28);
  --grid:      rgba(124,140,255,.10);
  --glow-cyan: 0 0 34px rgba(60,232,255,.40);
  --stage:     #02040a;                /* deck backdrop (set light for light themes) */
  --dot:       rgba(124,140,255,.10);  /* dot-grid texture tint                      */

  --font-display:'Sora','DejaVu Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','DejaVu Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace;

  --pad: 70px 88px;
}

/* ============================ STAGE ============================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--stage, #02040a);   /* deck backdrop behind the slide; themes override */
  color:var(--ink);
  font-family:var(--font-body);
  display:grid; place-items:center;
  overflow:hidden;
}
.deck{
  position:relative; width:1280px; height:720px;
  transform-origin:center center;
  border-radius:14px; overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}

/* base slide */
.slide{
  position:absolute; inset:0;
  padding:var(--pad);
  background:
    radial-gradient(1200px 700px at 18% -10%, rgba(60,232,255,.07), transparent 55%),
    radial-gradient(1000px 700px at 110% 120%, rgba(124,140,255,.10), transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
  opacity:0; visibility:hidden;
  display:flex; flex-direction:column;
}
.slide.active{opacity:1; visibility:visible}

/* subtle dot-grid texture shared by all slides */
.slide::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(var(--dot, rgba(124,140,255,.10)) 1px, transparent 1.4px);
  background-size:34px 34px; opacity:.30; mask-image:linear-gradient(transparent,#000 30%,#000 75%,transparent); z-index:1;
}
/* content sits above decorative layers; chrome sits above content */
.slide > *{position:relative; z-index:2}
.orb{z-index:0}
.rail,.tl-track,.tl-spark{z-index:1}
.pager,.progress{z-index:6}

/* ---- shared chrome (kicker + pager + progress) ---- */
.kicker{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.34em;
  text-transform:uppercase; color:var(--cyan);
  display:inline-flex; align-items:center; gap:12px;
}
.kicker::before{content:""; width:26px; height:2px; background:linear-gradient(90deg,var(--cyan),transparent)}
.pager{
  position:absolute; right:40px; bottom:30px; z-index:5;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--faint);
}
.progress{position:absolute; left:0; bottom:0; height:3px; z-index:6;
  background:linear-gradient(90deg,var(--cyan),var(--indigo)); box-shadow:var(--glow-cyan);
  transition:width .45s ease}

h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; line-height:1.04}
p{margin:0; color:var(--muted)}
.title{font-size:62px; letter-spacing:-.02em}
.subtitle{font-size:21px; line-height:1.5; color:var(--muted); max-width:62ch}
.eyebrow-row{display:flex; align-items:center; gap:18px; margin-bottom:30px}

/* glow text helper */
.glow{color:var(--cyan); text-shadow:var(--glow-cyan)}
/* inline emphasis produced by rich(): **bold**, `mono` */
.slide strong{font-weight:800}
.slide :not(pre)>code{font-family:var(--font-mono,monospace); font-size:.88em; padding:.06em .34em;
  border-radius:5px; background:color-mix(in srgb, var(--ink) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--ink) 14%, transparent)}

/* =====================================================================
   AMBIENT ANIMATIONS  (one per slide; calm + slow; disabled if user
   prefers reduced motion)
   ===================================================================== */
@media (prefers-reduced-motion: no-preference){
  /* 1 cover: drifting orbs */
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
  .orb{position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; animation:drift 16s ease-in-out infinite}
  /* 2 agenda: rail sheen */
  @keyframes sheen{0%{background-position:0 -200px}100%{background-position:0 400px}}
  /* 3 divider: breathing glow */
  @keyframes breathe{0%,100%{opacity:.55; filter:blur(2px)}50%{opacity:1; filter:blur(0)}}
  .big-index{animation:breathe 7s ease-in-out infinite}
  /* 4 stat grid: staggered border pulse */
  @keyframes cardpulse{0%,100%{border-color:var(--brd); box-shadow:none}50%{border-color:var(--brd-2); box-shadow:0 0 26px rgba(60,232,255,.16)}}
  .stat{animation:cardpulse 6s ease-in-out infinite}
  .stat:nth-child(2){animation-delay:1.5s}.stat:nth-child(3){animation-delay:3s}.stat:nth-child(4){animation-delay:4.5s}
  /* 5 big number: hue shimmer */
  @keyframes hue{0%,100%{text-shadow:0 0 40px rgba(60,232,255,.45)}50%{text-shadow:0 0 60px rgba(124,140,255,.55)}}
  .hero-num{animation:hue 6s ease-in-out infinite}
  /* 6 chart: line dash draw + grid shimmer */
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes gridshimmer{0%,100%{opacity:.5}50%{opacity:.85}}
  .chart-line{stroke-dasharray:2600; stroke-dashoffset:2600; animation:draw 2.4s ease-out .2s forwards}
  .chart-grid{animation:gridshimmer 5s ease-in-out infinite}
  /* 7 comparison: divider flow */
  @keyframes flow{0%{background-position:0 0}100%{background-position:0 240px}}
  .vs-rail{background-size:100% 240px; animation:flow 4s linear infinite}
  /* 8 quote: mark breathe */
  @keyframes markbreathe{0%,100%{opacity:.10; transform:translateY(0)}50%{opacity:.22; transform:translateY(-8px)}}
  .quote-mark{animation:markbreathe 8s ease-in-out infinite}
  /* 9 code: caret blink + top sweep */
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .caret{animation:blink 1.05s step-end infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .code-sweep{animation:sweep 5.5s ease-in-out infinite}
  /* 10 timeline: current node pulse + track light */
  @keyframes nodepulse{0%,100%{box-shadow:0 0 0 0 rgba(60,232,255,.45)}50%{box-shadow:0 0 0 12px rgba(60,232,255,0)}}
  .tl-dot.now{animation:nodepulse 3s ease-out infinite}
  @keyframes tracklight{0%{left:-12%}100%{left:104%}}
  .tl-spark{animation:tracklight 6s linear infinite}
  /* 11 pipeline: packet travels connectors */
  @keyframes packet{0%{left:0%}100%{left:100%}}
  .pipe-packet{animation:packet 4.5s ease-in-out infinite}
  /* 12 closing: slow ambient drift reused via .orb */
}

/* ============================================================
   SLIDE-SPECIFIC LAYOUTS
   ============================================================ */

/* 1 COVER */
.cover{justify-content:center}
.cover .title{font-size:96px; font-weight:800; letter-spacing:-.03em; line-height:.98}
.cover .title .glow{display:block}
.cover .subtitle{margin-top:26px; font-size:23px}
.cover .meta{position:absolute; left:88px; bottom:56px; display:flex; gap:26px;
  font-family:var(--font-mono); font-size:13px; letter-spacing:.12em; color:var(--faint)}
.cover .meta b{color:var(--ink); font-weight:500}
.orb.a{width:420px; height:420px; background:radial-gradient(circle,var(--cyan),transparent 65%); top:-120px; right:-60px}
.orb.b{width:520px; height:520px; background:radial-gradient(circle,var(--indigo),transparent 65%); bottom:-200px; right:120px; animation-delay:3s}
.orb.c{width:300px; height:300px; background:radial-gradient(circle,var(--mint),transparent 65%); top:200px; left:-120px; animation-delay:6s; opacity:.35}

/* 2 AGENDA */
.agenda-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 56px; margin-top:46px}
.ag-item{display:flex; align-items:flex-start; gap:20px; padding:18px 0; border-bottom:1px solid var(--brd)}
.ag-num{font-family:var(--font-mono); font-size:15px; color:var(--cyan); padding-top:5px; min-width:34px}
.ag-body h3{font-size:24px; font-weight:600}
.ag-body p{font-size:15px; margin-top:5px}
.rail{position:absolute; left:0; top:0; width:6px; height:100%;
  background:linear-gradient(180deg, transparent, var(--cyan), var(--indigo), transparent);
  background-size:100% 600px; animation:sheen 5s linear infinite; opacity:.8}

/* 3 SECTION DIVIDER */
.divider{justify-content:center}
.big-index{font-family:var(--font-display); font-weight:800; font-size:300px;
  line-height:.8; letter-spacing:-.04em;
  background:linear-gradient(180deg,var(--cyan),var(--indigo));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 60px rgba(60,232,255,.25)}
.divider .title{font-size:64px; margin-top:6px}
.divider .subtitle{margin-top:18px}

/* 4 STAT GRID */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px; margin-top:42px; flex:1}
.stat{background:var(--panel); border:1px solid var(--brd); border-radius:16px;
  padding:30px 32px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden}
.stat::before{content:""; position:absolute; left:0; top:0; width:4px; height:100%;
  background:linear-gradient(180deg,var(--cyan),var(--indigo))}
.stat .num{font-family:var(--font-display); font-weight:800; font-size:56px; letter-spacing:-.02em; color:var(--ink)}
.stat .num small{font-size:26px; color:var(--cyan); font-weight:700}
.stat .lbl{margin-top:8px; font-size:16px; color:var(--muted); line-height:1.45}

/* 5 BIG NUMBER */
.bignum{justify-content:center; align-items:flex-start; text-align:left}
.hero-num{font-family:var(--font-mono); font-weight:700; font-size:118px; letter-spacing:-.03em;
  color:var(--cyan); line-height:1; margin:14px 0 0}
.bignum .subtitle{margin-top:26px; font-size:22px}

/* 6 CHART */
.chart-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px}
.chart-wrap{flex:1; margin-top:14px; min-height:0}
.chart-wrap svg{width:100%; height:100%}

/* 7 COMPARISON */
.cmp{display:grid; grid-template-columns:1fr 64px 1fr; gap:0; flex:1; margin-top:40px}
.cmp-col{padding:34px 36px; background:var(--panel); border:1px solid var(--brd)}
.cmp-col:first-child{border-radius:16px 0 0 16px}
.cmp-col:last-child{border-radius:0 16px 16px 0}
.cmp-col h3{font-size:30px; margin-bottom:6px}
.cmp-col .tag{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase}
.cmp-col.sup .tag{color:var(--cyan)} .cmp-col.uns .tag{color:var(--mint)}
.cmp-col ul{list-style:none; padding:0; margin:22px 0 0}
.cmp-col li{display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--brd); font-size:16px; color:var(--muted)}
.cmp-col li::before{content:"›"; color:var(--cyan); font-family:var(--font-mono)}
.cmp-col.uns li::before{color:var(--mint)}
.vs-rail{position:relative; background:linear-gradient(180deg,transparent,var(--cyan),var(--indigo),transparent)}
.vs-badge{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:54px; height:54px; border-radius:50%; background:var(--bg-2); border:1px solid var(--brd-2);
  display:grid; place-items:center; font-family:var(--font-mono); font-size:14px; letter-spacing:.1em; color:var(--ink); z-index:2}

/* 8 QUOTE */
.quote{justify-content:center}
.quote-mark{position:absolute; top:40px; left:64px; font-family:var(--font-display);
  font-size:380px; line-height:1; color:var(--indigo); opacity:.12; pointer-events:none}
.quote blockquote{margin:0; font-family:var(--font-display); font-weight:600;
  font-size:52px; line-height:1.22; letter-spacing:-.015em; max-width:20ch; position:relative}
.quote .by{margin-top:34px; display:flex; align-items:center; gap:16px}
.quote .by .line{width:48px; height:2px; background:var(--cyan)}
.quote .by span{font-family:var(--font-mono); font-size:15px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase}

/* 9 CODE */
.code-stage{flex:1; margin-top:36px; display:flex; flex-direction:column; min-height:0}
.code-panel{position:relative; background:#080d1a; border:1px solid var(--brd); border-radius:14px;
  overflow:hidden; flex:1; display:flex; flex-direction:column}
.code-bar{display:flex; align-items:center; gap:9px; padding:14px 18px; border-bottom:1px solid var(--brd);
  font-family:var(--font-mono); font-size:12px; color:var(--faint)}
.dotrow{display:flex; gap:7px; margin-right:8px}
.dotrow i{width:11px; height:11px; border-radius:50%; display:block}
.dotrow i:nth-child(1){background:#ff5f57}.dotrow i:nth-child(2){background:#febc2e}.dotrow i:nth-child(3){background:#28c840}
.code-sweep{position:absolute; top:0; left:0; width:30%; height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
pre{margin:0; padding:26px 30px; font-family:var(--font-mono); font-size:18px; line-height:1.85; overflow:auto; flex:1}
pre .k{color:var(--indigo)} pre .fn{color:var(--cyan)} pre .s{color:var(--mint)}
pre .c{color:var(--faint); font-style:italic} pre .n{color:#ffcf7a}
.caret{display:inline-block; width:9px; height:20px; background:var(--cyan); vertical-align:-3px; margin-left:2px}
.code-cap{margin-top:18px; font-size:16px; color:var(--muted)}
.code-cap b{color:var(--cyan); font-weight:600}

/* 10 TIMELINE */
.timeline{position:relative; flex:1; margin-top:64px; display:flex; align-items:center}
.tl-track{position:absolute; left:0; right:0; top:50%; height:2px; background:var(--brd)}
.tl-spark{position:absolute; top:50%; transform:translateY(-50%); width:90px; height:3px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent); filter:blur(.4px)}
.tl-items{display:flex; justify-content:space-between; width:100%; position:relative; z-index:2}
.tl-item{display:flex; flex-direction:column; align-items:center; width:16%; text-align:center}
.tl-item .yr{font-family:var(--font-mono); font-size:18px; color:var(--cyan); margin-bottom:18px}
.tl-dot{width:16px; height:16px; border-radius:50%; background:var(--bg-2); border:2px solid var(--indigo)}
.tl-dot.now{background:var(--cyan); border-color:var(--cyan)}
.tl-item .ev{margin-top:18px; font-size:15px; color:var(--muted); line-height:1.4}
.tl-item .ev b{display:block; color:var(--ink); font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:3px}
.tl-item:nth-child(even){flex-direction:column-reverse}
.tl-item:nth-child(even) .yr{margin:18px 0 0}
.tl-item:nth-child(even) .ev{margin:0 0 18px}

/* 11 PIPELINE */
.pipe{flex:1; margin-top:60px; display:flex; align-items:center; justify-content:space-between; position:relative}
.pipe-node{position:relative; z-index:2; width:150px; height:150px; border-radius:20px;
  background:var(--panel); border:1px solid var(--brd-2); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; text-align:center}
.pipe-node .ico{font-size:34px; filter:drop-shadow(var(--glow-cyan))}
.pipe-node h3{font-size:17px; font-weight:600}
.pipe-node p{font-size:12px; padding:0 10px}
.pipe-conn{flex:1; height:2px; position:relative; background:linear-gradient(90deg,var(--brd-2),var(--brd-2))}
.pipe-conn::after{content:"›"; position:absolute; right:-4px; top:50%; transform:translateY(-50%);
  color:var(--indigo); font-family:var(--font-mono); font-size:20px}
.pipe-packet{position:absolute; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%;
  background:var(--cyan); box-shadow:var(--glow-cyan)}
.pipe-loop{position:absolute; left:0; right:0; bottom:-6px; text-align:center;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; color:var(--faint); text-transform:uppercase}

/* 12 CLOSING */
.closing{justify-content:center}
.closing .title{font-size:72px; font-weight:800}
.take{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:46px}
.take div{background:var(--panel); border:1px solid var(--brd); border-radius:14px; padding:24px 26px}
.take .n{font-family:var(--font-mono); color:var(--cyan); font-size:14px; letter-spacing:.2em}
.take h3{font-size:19px; font-weight:600; margin:12px 0 8px}
.take p{font-size:14px; line-height:1.5}
.closing .meta{margin-top:46px; display:flex; align-items:center; gap:16px}
.closing .meta .line{width:48px; height:2px; background:var(--cyan)}

.board-bar .nm{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-family:var(--font-display);
  font-weight:600; font-size:17px; color:var(--ink); z-index:2}
.board-row .val{font-family:var(--font-mono); font-size:18px; color:var(--ink); min-width:64px; text-align:right}

/* DIPTYCH — two contrasting color fields */
.diptych{padding:0; display:grid; grid-template-columns:1fr 1fr; flex:1}
.dip-panel{display:flex; flex-direction:column; justify-content:center; padding:var(--pad); position:relative}
.dip-panel.left{background:linear-gradient(160deg, var(--bg-2), var(--bg))}
.dip-panel.right{background:linear-gradient(160deg, color-mix(in srgb, var(--cyan) 22%, var(--bg-2)), var(--bg))}
.dip-panel .tag{font-family:var(--font-mono); font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan)}
.dip-panel .big{font-family:var(--font-display); font-weight:800; font-size:54px; line-height:1.04; margin-top:14px; letter-spacing:-.02em}
.dip-panel p{margin-top:16px; font-size:17px; color:var(--muted); max-width:32ch}
.dip-panel .divline{position:absolute; right:0; top:12%; height:76%; width:1px; background:var(--brd-2)}

/* MATRIX-2x2 — quadrant matrix with axis labels */
.matrix{position:relative; flex:1; margin-top:48px; display:grid; grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; gap:14px}
.mx-cell{background:var(--panel); border:1px solid var(--brd); border-radius:14px; padding:22px 24px; display:flex; flex-direction:column; justify-content:center}
.mx-cell h3{font-size:20px; font-weight:600; margin-bottom:6px}
.mx-cell p{font-size:14px; color:var(--muted); line-height:1.45}
.mx-cell.hot{border-color:var(--brd-2); box-shadow:0 0 26px rgba(60,232,255,.12)}
.mx-axis-x,.mx-axis-y{position:absolute; font-family:var(--font-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.mx-axis-x{bottom:-26px; left:50%; transform:translateX(-50%)}
.mx-axis-y{top:50%; left:-12px; transform:translateY(-50%) rotate(-90deg)}

/* STACK — layered horizontal bands (architecture/process layers) */
.stack{display:flex; flex-direction:column; gap:12px; flex:1; margin-top:34px; justify-content:center}
.stack-band{display:flex; align-items:center; gap:22px; padding:22px 28px; border-radius:14px;
  background:var(--panel); border:1px solid var(--brd); position:relative; overflow:hidden}
.stack-band::before{content:""; position:absolute; left:0; top:0; height:100%; width:5px;
  background:linear-gradient(180deg,var(--cyan),var(--indigo))}
.stack-band .si{font-size:30px; color:var(--cyan); min-width:40px; text-align:center}
.stack-band .st h3{font-size:21px; font-weight:600}
.stack-band .st p{font-size:15px; color:var(--muted); margin-top:3px}

/* QUOTE-MOSAIC — several short quotes in a grid */
.mosaic{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; flex:1; margin-top:34px}
.mq{background:var(--panel); border:1px solid var(--brd); border-radius:16px; padding:26px 28px; display:flex; flex-direction:column; justify-content:center}
.mq blockquote{margin:0; font-family:var(--font-display); font-weight:600; font-size:24px; line-height:1.3; letter-spacing:-.01em}
.mq .by{margin-top:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.12em; color:var(--cyan); text-transform:uppercase}

/* INDEX-MOSAIC — large numbered section index */
.indexm{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; flex:1; margin-top:38px}
.ix{position:relative; border:1px solid var(--brd); border-radius:16px; padding:26px; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end; min-height:150px}
.ix .ixn{position:absolute; top:8px; right:14px; font-family:var(--font-display); font-weight:800;
  font-size:96px; line-height:1; color:transparent; -webkit-text-stroke:1.5px var(--brd-2); opacity:.7}
.ix h3{font-size:20px; font-weight:600; position:relative}
.ix p{font-size:14px; color:var(--muted); margin-top:6px; position:relative}

/* BEFORE-AFTER — two stacked-state panels with arrow */
.bna{display:grid; grid-template-columns:1fr 56px 1fr; align-items:stretch; flex:1; margin-top:40px}
.bna-col{background:var(--panel); border:1px solid var(--brd); border-radius:16px; padding:30px 32px; display:flex; flex-direction:column}
.bna-col .tag{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint)}
.bna-col.after .tag{color:var(--mint)}
.bna-col h3{font-size:26px; font-weight:700; margin:8px 0 16px}
.bna-col ul{list-style:none; margin:0; padding:0}
.bna-col li{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--brd); font-size:15px; color:var(--muted)}
.bna-col li::before{content:"-"; color:var(--faint)}
.bna-col.after li::before{content:"+"; color:var(--mint)}
.bna-arrow{display:grid; place-items:center; color:var(--cyan); font-size:26px; font-family:var(--font-mono)}

/* DOC PANEL — reference deck uses this to show each layout's JSON usage */
.doc-panel{position:absolute; left:64px; right:64px; bottom:52px; z-index:4; margin:0;
  background:rgba(8,13,26,.82); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  border:1px solid var(--brd); border-left:3px solid var(--cyan); border-radius:10px;
  padding:12px 16px; max-height:30%; overflow:auto}
body.hide-docs .doc-panel{display:none}
.doc-panel .doc-h{font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px}
.doc-panel pre{padding:0; background:none; font-size:12.5px; line-height:1.5; color:var(--muted); white-space:pre-wrap}

/* =====================================================================
   PRINT — one slide per page, 16:9, frozen motion (drives PDF export)
   ===================================================================== */
@media print{
  @page{ size:1280px 720px; margin:0 }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
  html,body{ width:1280px; height:auto; overflow:visible; background:#fff; display:block; place-items:initial }
  .deck{ transform:none !important; width:1280px; height:auto; box-shadow:none; border-radius:0; overflow:visible }
  .slide{ position:relative !important; inset:auto !important; display:flex !important;
    opacity:1 !important; visibility:visible !important; width:1280px; height:720px;
    page-break-after:always; break-after:page; page-break-inside:avoid; break-inside:avoid }
  .slide:last-child{ page-break-after:auto; break-after:auto }
  .slide *{ animation:none !important; transition:none !important }
  .deck-ui, .doc-panel{ display:none !important }
  /* resolve entrance/hidden states so animation-revealed content is visible in the PDF
     (the JS beforeprint handler fills count-ups/rings; these cover the CSS-only ones) */
  .sg-fade-rise, .sg-stagger>*, .sg-kinetic span{ opacity:1 !important }
  .sg-reveal-wipe{ clip-path:none !important }
  .sg-typewriter{ width:auto !important; border-right:0 !important }
  .sg-draw path,.sg-draw line,.sg-draw polyline,.sg-draw circle,.sg-draw rect,.sg-draw ellipse,.sg-draw polygon,
  .sg-check circle,.sg-check .tick,.chart-line{ stroke-dashoffset:0 !important }
}

/* ambient override: a slide may set "ambient":"none" to silence motion */
.slide[data-ambient="none"] *{ animation:none !important }

/* =====================================================================
   CONFIGURABLE AMBIENTS  —  pick one per slide from the JSON with
   "ambient":"<name>". The renderer injects a <div class="amb amb-<name>">
   behind the content, so ANY layout can take ANY ambient. "auto" keeps the
   layout's built-in motion; "none" silences it. Each has a visible resting
   base (outside the motion query) so reduced-motion / PDF look finished.
   Several are canvas-design-inspired: rays, grain, contours, waves,
   constellation. All read theme variables, so they recolor with the theme.
   ===================================================================== */
.amb{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.slide>.amb{z-index:0}

/* orbs — drifting blurred color fields */
.amb-orbs::before,.amb-orbs::after{content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.40}
.amb-orbs::before{width:420px; height:420px; background:radial-gradient(circle,var(--cyan),transparent 65%); top:-120px; right:-60px}
.amb-orbs::after{width:520px; height:520px; background:radial-gradient(circle,var(--indigo),transparent 65%); bottom:-200px; left:-80px}

/* aurora — slow diagonal gradient wash */
.amb-aurora{background:linear-gradient(120deg,
  color-mix(in srgb,var(--cyan) 12%,transparent), color-mix(in srgb,var(--indigo) 12%,transparent),
  color-mix(in srgb,var(--mint) 10%,transparent), color-mix(in srgb,var(--indigo) 12%,transparent));
  background-size:300% 300%}

/* grid — drifting dot lattice */
.amb-grid{background-image:radial-gradient(var(--dot) 1px,transparent 1.4px); background-size:34px 34px; opacity:.5;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 75%,transparent); mask-image:linear-gradient(transparent,#000 30%,#000 75%,transparent)}

/* rays — slow rotating conic light (canvas-design: systematic radiance) */
.amb-rays{position:absolute; width:200%; height:200%; left:-50%; top:-50%; transform-origin:50% 50%;
  background:conic-gradient(from 0deg,
    transparent 0 17deg, color-mix(in srgb,var(--cyan) 9%,transparent) 17deg 20deg,
    transparent 20deg 37deg, color-mix(in srgb,var(--indigo) 8%,transparent) 37deg 40deg, transparent 40deg);
  -webkit-mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%); mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%)}

/* grain — fine film grain drift (canvas-design: paper/ink texture) */
.amb-grain{opacity:.06; background-image:repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.6) 0 1px, transparent 1px 3px)}

/* contours — topographic rings (canvas-design: map / observation) */
.amb-contours{opacity:.5; background-image:repeating-radial-gradient(circle at 28% 120%,
  transparent 0 38px, color-mix(in srgb,var(--cyan) 10%,transparent) 38px 40px)}

/* scan — single soft light bar sweeping down */
.amb-scan::after{content:""; position:absolute; left:0; right:0; top:-130px; height:130px;
  background:linear-gradient(var(--cyan),transparent); opacity:.08}

/* waves — drifting diagonal striations (canvas-design: contour fields) */
.amb-waves{opacity:.5; background:repeating-linear-gradient(100deg,
  transparent 0 38px, color-mix(in srgb,var(--cyan) 6%,transparent) 38px 40px);
  -webkit-mask-image:linear-gradient(transparent,#000); mask-image:linear-gradient(transparent,#000)}

/* glow — breathing central vignette */
.amb-glow{opacity:.6; background:radial-gradient(60% 60% at 50% 40%, color-mix(in srgb,var(--cyan) 12%,transparent), transparent 70%)}

/* constellation — faint twinkling points (canvas-design: charted sky) */
.amb-constellation{opacity:.5; background-image:
  radial-gradient(1.5px 1.5px at 20% 30%, var(--mint), transparent),
  radial-gradient(1.5px 1.5px at 70% 60%, var(--cyan), transparent),
  radial-gradient(1.5px 1.5px at 42% 82%, var(--indigo), transparent),
  radial-gradient(1.5px 1.5px at 86% 24%, var(--cyan), transparent),
  radial-gradient(1.5px 1.5px at 58% 16%, var(--mint), transparent)}

@media (prefers-reduced-motion: no-preference){
  .amb-orbs::before{animation:drift 16s ease-in-out infinite}
  .amb-orbs::after{animation:drift 20s ease-in-out infinite reverse}
  @keyframes ambAur{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .amb-aurora{animation:ambAur 20s ease infinite}
  @keyframes ambGrid{0%{background-position:0 0}100%{background-position:0 340px}}
  .amb-grid{animation:ambGrid 14s linear infinite}
  @keyframes ambRot{to{transform:rotate(360deg)}}
  .amb-rays{animation:ambRot 90s linear infinite}
  @keyframes ambGrain{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
  .amb-grain{animation:ambGrain .8s steps(4) infinite}
  @keyframes ambCont{0%{background-position:0 0}100%{background-position:0 -80px}}
  .amb-contours{animation:ambCont 18s linear infinite}
  @keyframes ambScan{0%{top:-130px}100%{top:100%}}
  .amb-scan::after{animation:ambScan 8s linear infinite}
  @keyframes ambWave{0%{background-position:0 0}100%{background-position:120px 0}}
  .amb-waves{animation:ambWave 11s linear infinite}
  @keyframes ambGlow{0%,100%{opacity:.35}50%{opacity:.70}}
  .amb-glow{animation:ambGlow 8s ease-in-out infinite}
  @keyframes ambTw{0%,100%{opacity:.30}50%{opacity:.70}}
  .amb-constellation{animation:ambTw 6s ease-in-out infinite}
}

<!-- deck engine: data-driven rendering, theming, export/import -->
<script id="deck-engine">
/* =====================================================================
   DECK ENGINE — data-driven rendering.
   A deck is a JSON document (the deck-data JSON block) rendered through a
   registry of layout templates. The renderer derives numbering/progress, so
   adding or reordering slides never means hand-editing pagers. Per-slide
   "theme" patches override the global :root as scoped CSS variables. Assets
   (icons/images/styles) are resolved from an inlined registry. The live deck
   also exports/imports its JSON and prints to PDF.
   ===================================================================== */
(function(){
  var W = window, D = document, SG = W.SG = W.SG || {};

  /* ---------- small helpers ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pad(n){ n=String(n); return n.length<2?'0'+n:n; }
  function pctw(i,t){ return (100*i/Math.max(1,t)).toFixed(2); }
  function arr(x){ return Array.isArray(x)?x:(x==null?[]:[x]); }
  /* rich(): escape, then allow a little safe inline emphasis authors can type
     in plain JSON strings — [[x]] glows in the accent color, **x** is bold,
     `x` is monospace. Keeps content readable without raw HTML. */
  function rich(s){ return esc(s)
      .replace(/\[\[(.+?)\]\]/g,'<span class="glow">$1</span>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code>$1</code>'); }
  SG.esc=esc; SG.rich=rich;   /* exposed so the Forge editor can escape/format text too */
  function kicker(t){ return t?'<div class="eyebrow-row"><span class="kicker">'+rich(t)+'</span></div>':''; }
  function title(t){ return t?'<h1 class="title">'+rich(t)+'</h1>':''; }
  /* split a string into per-letter kinetic spans (divider headline entrance) */
  function kinetic(s){ var o='',a=String(s).split(''); for(var i=0;i<a.length;i++){
    var ch=a[i]===' '?'&nbsp;':esc(a[i]); o+='<span style="--i:'+i+'">'+ch+'</span>'; } return o; }

  /* ---------- asset registry (icons inline+themeable, images base64) ---------- */
  SG.assets = SG.assets || {icons:{},images:{},styles:''};
  function loadAssets(){
    var el=D.getElementById('deck-assets'); if(!el) return;
    try{ var a=JSON.parse(el.textContent||'{}');
      SG.assets={icons:a.icons||{},images:a.images||{},styles:a.styles||''};
    }catch(e){}
    if(SG.assets.styles){ var st=D.createElement('style'); st.id='deck-custom-style';
      st.textContent=SG.assets.styles; D.head.appendChild(st); }
  }
  /* icon(spec): spec is a name, or {name,color,solid}. SVG inherits theme color
     via currentColor unless an explicit color (token like "--mint" or a literal)
     is given. Unknown names render nothing rather than breaking the slide. */
  function icon(spec){ if(!spec) return '';
    var name=typeof spec==='string'?spec:spec.name;
    var svg=(SG.assets.icons||{})[name]; if(!svg) return '';
    var color=(typeof spec==='object'&&spec.color)||'';
    var cls='ico-wrap'+(typeof spec==='object'&&spec.solid?' solid':'');
    var sty=color?(' style="color:'+(color.indexOf('--')===0?'var('+color+')':color)+'"'):'';
    return '<span class="'+cls+'"'+sty+'>'+svg+'</span>'; }
  function imageURL(name){ return (SG.assets.images||{})[name]||''; }

  /* =====================================================================
     LAYOUT REGISTRY  —  name -> function(content) -> innerHTML.
     Pager + progress are appended by the renderer, never here.
     ===================================================================== */
  var L = SG.layouts = {};

  L.cover=function(c){
    var meta=arr(c.meta).map(function(m){ var t=typeof m==='string'?m:m.text;
      return (typeof m==='object'&&m.strong)?'<span><b>'+esc(t)+'</b></span>':'<span>'+esc(t)+'</span>'; }).join('');
    return '<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>'
      + kicker(c.kicker)
      + '<h1 class="title sg-fade-rise sg-onenter">'+rich(c.title||'')
        + (c.accent?'<span class="glow sg-glow-pulse">'+esc(c.accent)+'</span>':'')+'</h1>'
      + (c.subtitle?'<p class="subtitle">'+rich(c.subtitle)+'</p>':'')
      + (meta?'<div class="meta">'+meta+'</div>':''); };

  L.agenda=function(c){
    var items=arr(c.items).map(function(it,i){
      return '<div class="ag-item"><div class="ag-num">'+pad(i+1)+'</div><div class="ag-body">'
        +'<h3>'+rich(it.title)+'</h3>'+(it.desc?'<p>'+rich(it.desc)+'</p>':'')+'</div></div>'; }).join('');
    return '<div class="rail"></div>'+kicker(c.kicker)+title(c.title)
      +'<div class="agenda-grid sg-stagger sg-onenter">'+items+'</div>'; };

  L.divider=function(c){
    return '<div class="big-index">'+esc(c.index||'')+'</div>'
      +'<h1 class="title"><span class="sg-kinetic sg-onenter">'+kinetic(c.title||'')+'</span></h1>'
      +(c.subtitle?'<p class="subtitle">'+rich(c.subtitle)+'</p>':''); };

  L['stat-grid']=function(c){
    var stats=arr(c.stats).map(function(s){
      var num = s.count!=null
        ? '<span class="sg-count" data-to="'+esc(s.count)+'" data-dur="1300"'
            +(s.fmt?' data-fmt="'+esc(s.fmt)+'"':'')+'>0</span>'
        : esc(s.value);
      var unit=s.unit?'<small>'+esc(s.unit)+'</small>':'';
      return '<div class="stat"><div class="num">'+num+unit+'</div><div class="lbl">'+rich(s.label)+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="stat-grid">'+stats+'</div>'; };

  L.bignum=function(c){
    var hero = c.count!=null
      ? '<span class="sg-count" data-to="'+esc(c.count)+'" data-dur="1800"'+(c.fmt?' data-fmt="'+esc(c.fmt)+'"':'')+'>0</span>'
      : esc(c.value);
    return kicker(c.kicker)+'<div class="hero-num">'+hero+'</div>'
      +(c.subtitle?'<p class="subtitle">'+rich(c.subtitle)+'</p>':''); };

  L.chart=function(c){
    var note=c.note?'<p style="font-family:var(--font-mono);font-size:13px;color:var(--faint)">'+esc(c.note)+'</p>':'';
    return '<div class="chart-head"><div>'+kicker(c.kicker)+title(c.title)+'</div>'+note+'</div>'
      +'<div class="chart-wrap">'+(c.body||'')+'</div>'; };  /* body = raw SVG / slidegen fragment */

  L.comparison=function(c){
    function col(side,cls){ if(!side) return '';
      var items=arr(side.items).map(function(x){return '<li>'+rich(x)+'</li>';}).join('');
      return '<div class="cmp-col '+cls+'">'+(side.tag?'<div class="tag">'+rich(side.tag)+'</div>':'')
        +'<h3>'+rich(side.title)+'</h3><ul>'+items+'</ul></div>'; }
    return kicker(c.kicker)+title(c.title)+'<div class="cmp">'
      +col(c.left,'sup')+'<div class="vs-rail"><div class="vs-badge">'+esc(c.badge||'VS')+'</div></div>'
      +col(c.right,'uns')+'</div>'; };

  L.quote=function(c){
    return '<div class="quote-mark">&ldquo;</div>'
      +'<blockquote class="sg-reveal-wipe sg-onenter">'+rich(c.quote)+'</blockquote>'
      +(c.by?'<div class="by"><div class="line"></div><span>'+rich(c.by)+'</span></div>':'')
      +(c.subtitle?'<p class="subtitle" style="margin-top:26px">'+rich(c.subtitle)+'</p>':''); };

  L.code=function(c){
    return kicker(c.kicker)+title(c.title)+'<div class="code-stage"><div class="code-panel">'
      +'<div class="code-bar"><span class="dotrow"><i></i><i></i><i></i></span>'+esc(c.filename||'')+'</div>'
      +'<div class="code-sweep"></div><pre>'+(c.code||'')+'<span class="caret"></span></pre></div>'
      +(c.caption?'<p class="code-cap">'+rich(c.caption)+'</p>':'')+'</div>'; };

  L.timeline=function(c){
    var items=arr(c.items).map(function(it){
      return '<div class="tl-item"><div class="yr">'+esc(it.year)+'</div>'
        +'<div class="tl-dot'+(it.now?' now':'')+'"></div>'
        +'<div class="ev"><b>'+rich(it.title)+'</b>'+rich(it.desc||'')+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)
      +'<div class="timeline"><div class="tl-track"></div><div class="tl-spark"></div>'
      +'<div class="tl-items">'+items+'</div></div>'; };

  L.pipeline=function(c){
    var nodes=arr(c.nodes), out='';
    nodes.forEach(function(n,i){
      var ico = n.iconAsset?icon(n.iconAsset):'<div class="ico">'+esc(n.icon||'')+'</div>';
      if(n.iconAsset) ico='<div class="ico">'+ico+'</div>';
      out+='<div class="pipe-node">'+ico+'<h3>'+rich(n.title)+'</h3>'+(n.desc?'<p>'+rich(n.desc)+'</p>':'')+'</div>';
      if(i<nodes.length-1) out+='<div class="pipe-conn"><div class="pipe-packet" style="animation-delay:'+(i*0.6)+'s"></div></div>'; });
    return kicker(c.kicker)+title(c.title)+'<div class="pipe">'+out
      +(c.loop?'<div class="pipe-loop">'+esc(c.loop)+'</div>':'')+'</div>'; };

  L.closing=function(c){
    var takes=arr(c.takeaways).map(function(t,i){
      return '<div><div class="n">'+pad(i+1)+'</div><h3>'+rich(t.title)+'</h3><p>'+rich(t.desc)+'</p></div>'; }).join('');
    var check='<svg class="sg-check sg-onenter" viewBox="0 0 52 52" width="30" height="30" fill="none" stroke="var(--mint)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24"></circle><path class="tick" d="M16 27 L23 34 L37 18"></path></svg>';
    return '<div class="orb b" style="opacity:.30"></div><div class="orb c"></div>'
      +kicker(c.kicker)
      +'<h1 class="title">'+rich(c.title||'')+(c.accent?' <span class="glow">'+esc(c.accent)+'</span>':'')+'</h1>'
      +'<div class="take sg-stagger sg-onenter">'+takes+'</div>'
      +(c.note?'<div class="meta">'+check+'<span>'+rich(c.note)+'</span></div>':''); };

  L.raw=function(c){ return c.html||''; };  /* escape hatch: literal HTML, still numbered+themed */

  /* ---------- new canvas-derived layouts ---------- */
  L.manifesto=function(c){
    var st=esc(c.statement||'').replace(/\[\[(.+?)\]\]/g,'<em>$1</em>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
    return '<div class="mark"></div><div class="statement sg-glow-pulse-box">'+st+'</div>'
      +(c.lead?'<p class="lead">'+rich(c.lead)+'</p>':''); };

  L.editorial=function(c){
    var cols=arr(c.columns).map(function(col){
      return '<div class="ed-col"><h3>'+rich(col.head)+'</h3><p>'+rich(col.body)+'</p></div>'; }).join('');
    return kicker(c.kicker)+'<div class="editorial">'
      +'<div class="ed-lead sg-reveal-wipe sg-onenter">'+rich(c.lead)+'</div>'
      +'<div class="ed-cols sg-stagger sg-onenter">'+cols+'</div></div>'; };

  L['hero-asym']=function(c){
    var rows=arr(c.rows).map(function(r){
      return '<div class="row"><div class="k">'+esc(r.k)+'</div><div class="v">'+esc(r.v)
        +(r.unit?'<small> '+esc(r.unit)+'</small>':'')+'</div></div>'; }).join('');
    var t=esc(c.title||'').replace(/\[\[(.+?)\]\]/g,'<em>$1</em>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
    return '<div class="hero-asym"><div><div class="htitle">'+t+'</div>'
      +(c.sub?'<p class="hsub">'+rich(c.sub)+'</p>':'')+'</div>'
      +'<div class="hero-rail sg-stagger sg-onenter">'+rows+'</div></div>'; };

  L.figure=function(c){
    var url=imageURL(c.image);
    var bg=url?'background-image:url('+JSON.stringify(url)+')':'background:linear-gradient(135deg,var(--bg-2),var(--bg))';
    return '<div class="fig-img" style="'+bg+'"></div><div class="fig-shade"></div>'
      +'<div class="fig-body">'+kicker(c.kicker)
      +'<div class="fig-title sg-reveal-wipe sg-onenter">'+rich(c.title)+'</div>'
      +(c.caption?'<p class="fig-cap">'+rich(c.caption)+'</p>':'')+'</div>'; };

  L['metric-dash']=function(c){
    var r=c.ring||{};
    var ring='<div class="dash-ring"><div class="sg-ring" data-p="'+esc(r.value||0)+'" data-suffix="'+esc(r.suffix||'%')+'">'
      +'<span class="sg-ring-v">0</span></div><div class="cap">'+rich(r.label||'')+'</div></div>';
    var tiles=arr(c.tiles).map(function(t){
      return '<div class="dash-tile"><div class="v">'+esc(t.value)+(t.unit?'<small>'+esc(t.unit)+'</small>':'')+'</div>'
        +'<div class="l">'+rich(t.label)+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="dash">'+ring+'<div class="dash-tiles sg-stagger sg-onenter">'+tiles+'</div></div>'; };

  L.leaderboard=function(c){
    var rows=arr(c.rows), max=0; rows.forEach(function(r){ var v=parseFloat(r.pct!=null?r.pct:r.value)||0; if(v>max)max=v; });
    var body=rows.map(function(r,i){ var v=parseFloat(r.pct!=null?r.pct:r.value)||0; var w=max?Math.round(v/max*100):0;
      return '<div class="board-row"><div class="rk">'+pad(i+1)+'</div>'
        +'<div class="board-bar"><div class="fill" style="width:'+w+'%"></div><div class="nm">'+rich(r.name)+'</div></div>'
        +'<div class="val">'+esc(r.value)+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="board sg-stagger sg-onenter">'+body+'</div>'; };

  L.diptych=function(c){
    function panel(side,cls){ side=side||{};
      return '<div class="dip-panel '+cls+'">'+(cls==='left'?'<div class="divline"></div>':'')
        +(side.tag?'<div class="tag">'+esc(side.tag)+'</div>':'')
        +'<div class="big">'+rich(side.title)+'</div>'+(side.body?'<p>'+rich(side.body)+'</p>':'')+'</div>'; }
    return panel(c.left,'left')+panel(c.right,'right'); };

  L.matrix=function(c){
    var cells=arr(c.cells).map(function(q){
      return '<div class="mx-cell'+(q.hot?' hot':'')+'"><h3>'+rich(q.title)+'</h3><p>'+rich(q.desc)+'</p></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="matrix sg-stagger sg-onenter">'+cells
      +(c.xlabel?'<div class="mx-axis-x">'+esc(c.xlabel)+'</div>':'')
      +(c.ylabel?'<div class="mx-axis-y">'+esc(c.ylabel)+'</div>':'')+'</div>'; };

  L.stack=function(c){
    var bands=arr(c.bands).map(function(b){
      var ic=b.iconAsset?icon(b.iconAsset):'<span class="si">'+esc(b.icon||'')+'</span>';
      if(b.iconAsset) ic='<span class="si">'+ic+'</span>';
      return '<div class="stack-band">'+ic+'<div class="st"><h3>'+rich(b.title)+'</h3>'+(b.desc?'<p>'+rich(b.desc)+'</p>':'')+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="stack sg-stagger sg-onenter">'+bands+'</div>'; };

  L['quote-mosaic']=function(c){
    var qs=arr(c.quotes).map(function(q){
      return '<div class="mq"><blockquote>'+rich(q.quote)+'</blockquote><div class="by">'+rich(q.by)+'</div></div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="mosaic sg-stagger sg-onenter">'+qs+'</div>'; };

  L['index-mosaic']=function(c){
    var items=arr(c.items).map(function(it,i){
      return '<div class="ix"><div class="ixn">'+pad(i+1)+'</div><h3>'+rich(it.title)+'</h3>'
        +(it.desc?'<p>'+rich(it.desc)+'</p>':'')+'</div>'; }).join('');
    return kicker(c.kicker)+title(c.title)+'<div class="indexm sg-stagger sg-onenter">'+items+'</div>'; };

  L['before-after']=function(c){
    function col(s,cls){ s=s||{}; var items=arr(s.items).map(function(x){return '<li>'+rich(x)+'</li>';}).join('');
      return '<div class="bna-col '+cls+'"><div class="tag">'+rich(s.tag||(cls==='after'?'After':'Before'))+'</div>'
        +'<h3>'+rich(s.title)+'</h3><ul>'+items+'</ul></div>'; }
    return kicker(c.kicker)+title(c.title)+'<div class="bna">'+col(c.before,'before')
      +'<div class="bna-arrow">&rarr;</div>'+col(c.after,'after')+'</div>'; };

  /* =====================================================================
     RENDER  —  build slides from data, derive numbering, apply per-slide theme
     ===================================================================== */
  function themeStyle(theme){ if(!theme||typeof theme!=='object') return '';
    return Object.keys(theme).map(function(k){ return esc(k)+':'+esc(theme[k]); }).join(';'); }

  function applyGlobalTheme(theme){ if(theme&&typeof theme==='object'){
    var root=D.documentElement; Object.keys(theme).forEach(function(k){ root.style.setProperty(k,theme[k]); }); } }

  /* Layouts whose CSS targets the <section> itself. Every other layout styles
     INNER containers only, so putting the layout name on the section would let an
     inner class (e.g. .matrix, .timeline, .stat-grid) restyle the slide and break
     .slide{position:absolute;inset:0}. We add a harmless lyt-<name> hook instead. */
  var SECTION_LAYOUTS={cover:1,divider:1,bignum:1,quote:1,closing:1,manifesto:1,figure:1,diptych:1};

  SG.render=function(deck,data){
    data=data||SG.data; SG.data=data;
    var slides=arr(data.slides), total=slides.length;
    var defAmb=(data.defaults&&data.defaults.ambient)||'auto';
    applyGlobalTheme(data.theme);
    if(data.meta){ if(data.meta.title) D.title=data.meta.title;
      if(data.meta.seed!=null){ D.documentElement.setAttribute('data-seed',data.meta.seed);
        SG.rng=SG.makeRng(parseInt(data.meta.seed,10)||1); } }
    var html='';
    slides.forEach(function(s,i){
      var fn=L[s.layout]||L.raw;
      var inner; try{ inner=fn(s.content||{},{index:i,total:total}); }
      catch(e){ inner='<div class="title" style="color:var(--cyan)">⚠ layout "'+esc(s.layout)+'" failed</div>'
        +'<p class="subtitle">'+esc(e.message)+'</p>'; }
      var lay=s.layout||'raw';
      var cls='slide'+(SECTION_LAYOUTS[lay]?(' '+lay):'')+' lyt-'+lay+(s.class?(' '+s.class):'');
      var sty=themeStyle(s.theme);
      /* resolve the ambient: a named one injects a universal background layer;
         "none" silences motion; "auto"/absent keeps the layout's built-in ambient. */
      var amb=(s.ambient!=null)?s.ambient:defAmb, ambLayer='', ambAttr='';
      if(amb==='none'){ ambAttr=' data-ambient="none"'; }
      else if(amb&&amb!=='auto'){ ambLayer='<div class="amb amb-'+esc(amb)+'" aria-hidden="true"></div>'; }
      html+='<section class="'+cls+'" data-i="'+(i+1)+'"'
        +(sty?' style="'+sty+'"':'')+ambAttr+'>'
        +ambLayer+inner
        +(s.doc?'<div class="doc-panel"><div class="doc-h">JSON · layout "'+esc(s.layout)+'"</div><pre>'+esc(s.doc)+'</pre></div>':'')
        +'<div class="pager">'+pad(i+1)+' / '+pad(total)+'</div>'
        +'<div class="progress" style="width:'+pctw(i+1,total)+'%"></div>'
        +'</section>';
    });
    deck.innerHTML=html;
  };

  /* =====================================================================
     NAVIGATION + responsive fit + per-slide deep links (re-entrant: rebuilt
     on import). Global listeners bind once; refresh() re-reads the slides.
     ===================================================================== */
  function mountNav(deck){
    var slides=[], n=0, cur=0;
    function refresh(){ slides=[].slice.call(deck.querySelectorAll('.slide')); n=slides.length; fromHash(); }
    function clamp(i){ return Math.max(0,Math.min(n-1,i)); }
    function show(i){ cur=clamp(i);
      slides.forEach(function(s,k){ s.classList.toggle('active',k===cur); });
      if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1)); }
    function fromHash(){ var h=parseInt((location.hash||'').slice(1),10); show(isNaN(h)?0:h-1); }
    function fit(){ var s=Math.min(W.innerWidth/1280,W.innerHeight/720); deck.style.transform='scale('+s+')'; }
    SG.show=show; SG.refresh=function(){ refresh(); fit(); };
    if(!SG._bound){ SG._bound=true;
      W.addEventListener('keydown',function(e){
        if(/^(input|textarea)$/i.test((e.target.tagName||''))) return;
        if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){ show(cur+1); e.preventDefault(); }
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ show(cur-1); e.preventDefault(); }
        else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(n-1); }
        else if(e.key==='e'||e.key==='E'){ SG.exportJSON(); }
        else if(e.key==='i'||e.key==='I'){ SG.importJSON(); }
        else if(e.key==='p'||e.key==='P'){ W.print(); }
        else if(e.key==='d'||e.key==='D'){ SG.toggleDocs(); }
        else if(e.key==='f'||e.key==='F'){ SG.present(); } });
      D.addEventListener('fullscreenchange',function(){
        if(!(D.fullscreenElement||D.webkitFullscreenElement)) D.body.classList.remove('presenting'); });
      deck.addEventListener('click',function(e){ if(e.target.closest('a,button,input')) return; show(cur+1); });
      W.addEventListener('resize',fit);
      W.addEventListener('hashchange',fromHash);
    }
    refresh(); fit();
  }

  /* ---------- export / import / pdf ---------- */
  SG.exportJSON=function(){
    var blob=new Blob([JSON.stringify(SG.data,null,2)],{type:'application/json'});
    var a=D.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=((SG.data.meta&&SG.data.meta.title)||'deck').replace(/[^\w.-]+/g,'-').toLowerCase()+'.json';
    D.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000); };
  SG.importJSON=function(){ var inp=D.getElementById('deck-import'); if(inp) inp.click(); };
  SG.toggleDocs=function(){ D.body.classList.toggle('hide-docs'); };
  SG.present=function(){
    var el=D.documentElement, fs=D.fullscreenElement||D.webkitFullscreenElement;
    if(!fs){ var req=el.requestFullscreen||el.webkitRequestFullscreen; if(req) req.call(el);
      D.body.classList.add('presenting'); }
    else { var ex=D.exitFullscreen||D.webkitExitFullscreen; if(ex) ex.call(D);
      D.body.classList.remove('presenting'); } };
  function onImportFile(file){ var fr=new FileReader();
    fr.onload=function(){ try{ var data=JSON.parse(fr.result);
      SG.render(D.getElementById('deck'),data); SG.refresh();
    }catch(err){ alert('Could not import JSON: '+err.message); } };
    fr.readAsText(file); }

  /* ---- resolve animated content to its FINAL state for printing/PDF ----
     window.print() (the P key / Save PDF button) does NOT force reduced motion, so on
     every non-active slide the entrance animations are still in their hidden initial
     state when the browser captures the PDF. beforeprint fills the JS-driven ones
     (count-ups, KPI rings) and flags entrance elements; print CSS resolves the CSS-only
     ones. (render.sh --pdf already forces reduced motion, so this is belt-and-suspenders.) */
  function fmtCompact(n){ var a=Math.abs(n),T=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
    for(var i=0;i<T.length;i++){ if(a>=T[i][0]) return (n/T[i][0]).toFixed(1).replace(/\.0$/,'')+T[i][1]; }
    return String(Math.round(n)); }
  SG.finalizeAnimations=function(scope){ scope=scope||D;
    scope.querySelectorAll('.sg-count').forEach(function(n){
      var to=parseFloat(n.dataset.to)||0, suf=n.dataset.suffix||'';
      n.textContent=(n.dataset.fmt==='compact'?fmtCompact(to):Math.round(to).toLocaleString())+suf; });
    scope.querySelectorAll('.sg-ring').forEach(function(n){
      var p=+n.dataset.p||0, v=n.querySelector('.sg-ring-v');
      n.style.setProperty('--p',p); if(v) v.textContent=p+(n.dataset.suffix||'%'); });
    scope.querySelectorAll('.sg-onenter,.sg-draw').forEach(function(n){ n.classList.add('run'); }); };
  W.addEventListener('beforeprint', function(){ SG.finalizeAnimations(); });

  /* ---------- boot ---------- */
  SG.boot=function(){
    loadAssets();
    var deck=D.getElementById('deck');
    var dataEl=D.getElementById('deck-data');
    try{ SG.data=JSON.parse(dataEl.textContent); }
    catch(e){ deck.innerHTML='<section class="slide active"><div class="title">⚠ deck-data is not valid JSON</div><p class="subtitle">'+esc(e.message)+'</p></section>'; return; }
    SG.render(deck,SG.data);
    mountNav(deck);
    var inp=D.getElementById('deck-import');
    if(inp) inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) onImportFile(inp.files[0]); inp.value=''; });
  };
})();

</script>

/* floating WYSIWYG format toolbar shown over a text selection while editing on-canvas */

#forge-ctx .forge-ctx-sep{ height:1px; margin:4px 6px; background:rgba(255,255,255,.10); }

/* live-edit pulse — flashes the selected element whenever an inspector field changes it,
   so it's obvious WHICH element the sidebar is driving. Uses box-shadow (not outline) so it
   never fights .forge-sel's !important selection outline. */
@keyframes forgePulse{ 0%{ box-shadow:0 0 0 0 rgba(46,230,166,0); }
  28%{ box-shadow:0 0 0 4px rgba(46,230,166,.6); } 100%{ box-shadow:0 0 0 0 rgba(46,230,166,0); } }
.forge-live{ animation:forgePulse .45s ease-out; }

.forge-handles{ position:absolute; inset:0; pointer-events:none; z-index:50; }
.forge-h{
  position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px;
  background:#2a6df4; border:2px solid #fff; border-radius:3px; pointer-events:auto;
}
.forge-h.tl{ left:0; top:0; cursor:nwse-resize; }
.forge-h.tr{ left:100%; top:0; cursor:nesw-resize; }
.forge-h.bl{ left:0; top:100%; cursor:nesw-resize; }
.forge-h.br{ left:100%; top:100%; cursor:nwse-resize; }
.forge-h.rot{ left:50%; top:-30px; border-radius:50%; background:#2ee6a6; cursor:grab; }

/* free objects -------------------------------------------- */
.forge-free{ position:absolute; left:0; top:0; transform-origin:center center; z-index:3; }
.forge-free.txt{ color:var(--ink); font-family:var(--font-display,inherit); font-size:34px; font-weight:700; }
.forge-free.box{ background:var(--panel); border:1px solid var(--brd); border-radius:14px; }

/* restore bar --------------------------------------------- */
#forge-restore{
  position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:9100;
  display:none; align-items:center; gap:12px; padding:9px 14px; border-radius:10px;
  background:#161b25; border:1px solid rgba(255,255,255,.14); color:#eaf1fb; font-size:13px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
body.forge-edit #forge-bar .forge-title{ color:#7e8aa0; font-size:12px; margin-right:auto; padding-left:4px; }
/* ---- content editor widgets (nested fields, arrays) ---- */
.forge-subh{ display:flex; align-items:center; gap:7px; margin:0 0 11px; font-size:10.5px;
  letter-spacing:.16em; text-transform:uppercase; color:#aeb9cd; font-weight:700; }
.forge-subh::before{ content:""; width:3px; height:12px; border-radius:2px; background:#2a6df4; flex:none; }
.forge-field textarea{ width:100%; min-height:34px; resize:vertical; padding:6px 8px; border-radius:6px;
  background:#10151e; color:#eaf1fb; border:1px solid rgba(255,255,255,.12); font:13px/1.4 var(--font-mono,monospace); }
.forge-card{ background:#10151e; border:1px solid rgba(255,255,255,.10); border-radius:8px; padding:8px 10px; margin:6px 0; }
.forge-card-h{ display:flex; align-items:center; justify-content:space-between; font-size:11px; color:#9aa6ba; font-weight:700; margin-bottom:4px; }
.forge-card-tools{ display:flex; gap:3px; }
.forge-arr{ margin:8px 0; }
.forge-arr-h{ display:flex; align-items:center; justify-content:space-between; font-size:12px; color:#cdd6e6; font-weight:700; margin:8px 0 2px; }
.forge-chip{ display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px;
  border-radius:6px; background:#1a212d; color:#cdd6e6; border:1px solid rgba(255,255,255,.12); font-size:12px; font-weight:700; cursor:pointer; }
.forge-chip:hover{ background:#222b3a; }
.forge-chip.add{ background:#173a2a; border-color:#1f6d4a; color:#9af0c4; }
.forge-chip.warn{ background:#3a1717; border-color:#6d1f1f; color:#f0a0a0; }
.forge-chip[disabled]{ opacity:.35; cursor:default; }
/* compact theme-token color grid (deck settings) */
.forge-tokens{ display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; margin-top:4px; }
.forge-token{ display:flex; align-items:center; gap:7px; font-size:11px; color:#9aa6ba; cursor:pointer; }
.forge-token input[type=color]{ width:26px; height:22px; flex:none; }
.forge-token span{ font-family:var(--font-mono,monospace); }

</style>
