     as the way into on-canvas text editing, so the action is explicit + discoverable.
     ===================================================================== */
  var ctxMenu=null;
  function buildCtxMenu(){ ctxMenu=el('div','forge-chrome'); ctxMenu.id='forge-ctx'; D.body.appendChild(ctxMenu); }
  function hideCtxMenu(){ if(ctxMenu) ctxMenu.classList.remove('on'); }
  F.hideCtxMenu=hideCtxMenu;
  function ctxItem(label,cls,fn){ var b=el('button',cls||null,label); b.onclick=function(){ hideCtxMenu(); fn(); }; return b; }
  function showCtxMenu(x,y,node){ if(!ctxMenu) buildCtxMenu(); ctxMenu.innerHTML='';
    var isFree=node.hasAttribute('data-free'), isLeafText=!isFree && !keyableChildren(node).length;
    if(isLeafText) ctxMenu.appendChild(ctxItem('✎ Edit text',null,function(){ startEdit(node); }));
    ctxMenu.appendChild(ctxItem('☐ Select element',null,function(){ selectNode(node); }));
    ctxMenu.appendChild(el('div','forge-ctx-sep'));
    ctxMenu.appendChild(ctxItem(isFree?'🗑 Delete object':'↺ Reset element','warn',function(){
      var sl=slideIdxOf(node), k=node.getAttribute('data-el'), id=node.getAttribute('data-free');
      F.do(isFree?'delete object':'reset element',function(data){ var s=data.slides[sl];
        if(isFree) s.freeObjects=(s.freeObjects||[]).filter(function(f){return f.id!==id;}); else if(s.overrides) delete s.overrides[k]; });
      clearSel(); F.buildInspect(); }));
    ctxMenu.classList.add('on');
    var mw=ctxMenu.offsetWidth||156, mh=ctxMenu.offsetHeight||100;
    ctxMenu.style.left=Math.min(x, W.innerWidth-mw-8)+'px';
    ctxMenu.style.top=Math.min(y, W.innerHeight-mh-8)+'px'; }

  function wireDeck(){ var deck=deckEl();
    deck.addEventListener('pointerdown',function(e){ if(!D.body.classList.contains('forge-edit')) return;
      if(e.button!==0) return;                          /* right/middle button: handled by contextmenu, no select/drag */
      if(F.editing){ if(F.editing.contains(e.target)) return; endEdit(); return; }   /* click outside commits the edit */
      var hnd=e.target.closest('.forge-h'); if(hnd){ startDrag(e, hnd.dataset.h==='rot'?'rot':'resize'); return; }
      /* Alt-click drills into the deepest nested element (item / child field) under the cursor */
      if(e.altKey){ var deep=e.target.closest('[data-el]'); if(deep){ e.preventDefault(); selectNode(deep); return; } }
      var blk=e.target.closest('.forge-block'); if(blk){ if(!F.sel||F.sel.node!==blk) selectNode(blk); startDrag(e,'move'); return; }
      clearSel(); F.buildInspect(); },true);
    /* right-click a block → context menu: Edit text (leaf text only), Select, Reset/Delete */
    deck.addEventListener('contextmenu',function(e){ if(!D.body.classList.contains('forge-edit')) return;
      if(F.editing && F.editing.contains(e.target)) return;                          /* editing: keep native menu (spellcheck/paste) */
      var node=e.target.closest('[data-el],[data-free]'); if(!node) return;          /* not on a block → native menu */
      e.preventDefault(); if(F.editing) endEdit();                                   /* right-click elsewhere commits the edit */
      showCtxMenu(e.clientX, e.clientY, node); },true);
    /* block present-mode click-to-advance while editing */
    deck.addEventListener('click',function(e){ if(D.body.classList.contains('forge-edit')){ e.stopImmediatePropagation(); e.stopPropagation(); } },true);
    /* dismiss the context menu on any outside press, and on scroll (its anchor goes stale) */
    D.addEventListener('pointerdown',function(e){ if(ctxMenu && ctxMenu.classList.contains('on') && !ctxMenu.contains(e.target)) hideCtxMenu(); },true);
    W.addEventListener('scroll',function(){ hideCtxMenu(); if(F.editing) positionFmtBar(); },true);
  }

  /* =====================================================================
     UI scaffolding
     ===================================================================== */
  F.buildChrome=function(){
    var launch=el('button','forge-chrome','✎ Edit'); launch.id='forge-launch'; launch.onclick=F.toggle; D.body.appendChild(launch);
    var bar=el('div','forge-chrome'); bar.id='forge-bar'; bar.innerHTML='<span class="forge-title"></span>';
    function btn(label,fn,cls){ var b=el('button','forge-btn '+(cls||''),label); b.onclick=fn; bar.appendChild(b); return b; }
    F._undoBtn=btn('↶ Undo',F.undoOp); F._redoBtn=btn('↷ Redo',F.redoOp); bar.appendChild(el('span','forge-sep'));
    btn('＋ Slide',function(){ F.addSlide(); }); btn('⧉ Duplicate',function(){ F.dupSlide(); });
    btn('＋ Text',function(){ F.addFree('txt'); }); btn('＋ Box',function(){ F.addFree('box'); }); bar.appendChild(el('span','forge-sep'));
    btn('▷ Present',function(){ F.toggle(); SG.present&&SG.present(); });
    btn('⤓ Save .html',function(){ F.download(); },'primary'); btn('{ } JSON',function(){ SG.exportJSON&&SG.exportJSON(); });
    D.body.appendChild(bar);
    var nav=el('div','forge-chrome forge-panel'); nav.id='forge-nav'; nav.innerHTML='<h4>Slides</h4><div id="forge-navlist"></div>'; D.body.appendChild(nav);
    var insp=el('div','forge-chrome forge-panel'); insp.id='forge-inspect'; insp.innerHTML='<h4>Inspector</h4><div id="forge-inspbody"></div>'; D.body.appendChild(insp);
    var rb=el('div','forge-chrome'); rb.id='forge-restore'; D.body.appendChild(rb);
  };

  F.buildNav=function(){ var list=D.getElementById('forge-navlist'); if(!list) return; var cur=curSlide(); list.innerHTML='';
    (SG.data.slides||[]).forEach(function(s,i){ var t=(s.content&&(s.content.title||s.content.statement||s.content.quote))||s.layout;
      var row=el('div','forge-srow'+(i===cur?' cur':''));
      row.innerHTML='<span class="si">'+(i+1)+'</span><span class="sl">'+String(t).replace(/[<>&]/g,'').slice(0,26)+'</span><span class="st">'+s.layout+'</span>';
      row.onclick=function(){ location.hash='#'+(i+1); clearSel(); F.buildNav(); F.buildInspect(); }; list.appendChild(row); }); };

  /* ---- field widgets ---- */
  function field(label,inputEl){ var f=el('div','forge-field'); f.appendChild(el('label',null,label)); f.appendChild(inputEl); return f; }
  function fieldRow(label,inputEl){ var f=field(label,inputEl); f.className='forge-field row'; return f; }
  function colorInput(val,on){ var n=el('input'); n.type='color'; n.value=/^#/.test(val||'')?val.slice(0,7):'#888888'; n.oninput=function(){ on(n.value); }; return n; }
  function selectInput(opts,val,on){ var s=el('select'); opts.forEach(function(o){ var v=Array.isArray(o)?o[1]:o, lab=Array.isArray(o)?o[0]:o; var op=el('option',null,lab); op.value=v; if(v===val)op.selected=true; s.appendChild(op); }); s.onchange=function(){ on(s.value); }; return s; }
  /* a text/number field bound to obj[key]; live edits keep focus via renderLive */
  function boundText(obj,key,multiline){ var n=el(multiline?'textarea':'input'); if(!multiline) n.type='text';
    n.className='wide'; n.value=obj[key]==null?'':obj[key]; if(multiline) n.rows=Math.min(8,Math.max(2,String(obj[key]||'').split('\n').length));
    n.onfocus=function(){ F.pushUndo(); }; n.oninput=function(){ obj[key]=n.value; F.renderLive(); }; return n; }
  function boundNum(obj,key){ var n=el('input'); n.type='number'; n.value=obj[key]==null?0:obj[key];
    n.onfocus=function(){ F.pushUndo(); }; n.oninput=function(){ var v=parseFloat(n.value); obj[key]=isNaN(v)?0:v; F.renderLive(); }; return n; }
  /* Inline emphasis (bold / glow / mono) is applied ON-CANVAS now — select text while
     editing an element and use the floating toolbar (see the WYSIWYG section below).
     The sidebar no longer carries emphasis chips, so there's one place to format. */

  /* =====================================================================
     CONTENT EDITOR — introspects the slide's content; nested arrays editable
     as separate cards with add/remove.
     ===================================================================== */
  function newItemFor(arr){ if(arr.length){ var last=arr[arr.length-1]; return (last&&typeof last==='object')?clone(last):''; } return {label:""}; }
  function renderValue(parent,key,host){ /* host = container; parent[key] is the value */
    var val=parent[key];
    if(typeof val==='string'){ var ml=val.length>40||/\n/.test(val)||key==='code'||key==='body'||key==='html';
      var inp=boundText(parent,key,ml); host.appendChild(field(pretty(key),inp));
      return; }
    if(typeof val==='number'){ host.appendChild(field(pretty(key),boundNum(parent,key))); return; }
    if(typeof val==='boolean'){ var cb=el('input'); cb.type='checkbox'; cb.checked=val; cb.onchange=function(){ F.do('toggle',function(){ parent[key]=cb.checked; }); }; host.appendChild(fieldRow(pretty(key),cb)); return; }
    if(Array.isArray(val)){ renderArray(parent,key,host); return; }
    if(val&&typeof val==='object'){ var card=el('div','forge-card'); card.appendChild(el('div','forge-card-h',pretty(key)));
      Object.keys(val).forEach(function(k){ renderValue(val,k,card); }); host.appendChild(card); return; }
  }
  function renderArray(parent,key,host){ var arr=parent[key];
    var wrap=el('div','forge-arr'); var head=el('div','forge-arr-h');
    head.appendChild(el('span',null,pretty(key)+' ('+arr.length+')'));
    var add=el('button','forge-chip add','＋ Add'); add.onclick=function(){ F.do('add item',function(){ arr.push(newItemFor(arr)); }); };
    head.appendChild(add); wrap.appendChild(head);
    arr.forEach(function(item,idx){ var card=el('div','forge-card');
      var ch=el('div','forge-card-h'); ch.appendChild(el('span',null,'#'+(idx+1)));
      var del=el('button','forge-chip warn','✕'); del.title='Remove'; del.onclick=function(){ F.do('remove item',function(){ arr.splice(idx,1); }); };
      var up=el('button','forge-chip','↑'); up.disabled=idx===0; up.onclick=function(){ F.do('reorder',function(){ var t=arr[idx-1]; arr[idx-1]=arr[idx]; arr[idx]=t; }); };
      var dn=el('button','forge-chip','↓'); dn.disabled=idx===arr.length-1; dn.onclick=function(){ F.do('reorder',function(){ var t=arr[idx+1]; arr[idx+1]=arr[idx]; arr[idx]=t; }); };
      var tools=el('div','forge-card-tools'); tools.appendChild(up); tools.appendChild(dn); tools.appendChild(del); ch.appendChild(tools); card.appendChild(ch);
      if(item&&typeof item==='object'){ Object.keys(item).forEach(function(k){ renderValue(item,k,card); }); }
      else { var box={v:item}; var inp=boundText(box,'v',false); inp.onfocus=function(){ F.pushUndo(); }; inp.oninput=function(){ arr[idx]=inp.value; F.renderLive(); }; card.appendChild(field('Text',inp)); }
      wrap.appendChild(card); });
    host.appendChild(wrap); }

  function buildContentEditor(i,host){ var s=SG.data.slides[i]; if(!s) return; s.content=s.content||{};
    var sec=el('div','forge-sec'); sec.appendChild(el('h4','forge-subh','Content · '+s.layout));
    if(s.layout==='raw'){ sec.appendChild(el('div','forge-hint','Raw slide: edit the HTML directly.')); }
    var keys=Object.keys(s.content); if(!keys.length) sec.appendChild(el('div','forge-hint','No fields. Switch layout below to add structure.'));
    keys.forEach(function(k){ renderValue(s.content,k,sec); }); host.appendChild(sec); }

  /* =====================================================================
     OBJECT PANEL (geometry + text style)
     ===================================================================== */
  function buildObjectPanel(host){ var d=selData();
    var sec=el('div','forge-sec'); sec.appendChild(el('h4','forge-subh',F.sel.kind==='free'?'Object · free':'Object · element '+F.sel.key));
    sec.appendChild(fieldRow('X',geomNum('x'))); sec.appendChild(fieldRow('Y',geomNum('y')));
    var sc=el('input'); sc.type='range'; sc.min=0.3; sc.max=3; sc.step=0.05; sc.value=d.scale||1; sc.oninput=function(){ d.scale=parseFloat(sc.value); reflow(); }; sc.onmousedown=function(){F.pushUndo();}; sec.appendChild(fieldRow('Scale',sc));
    sec.appendChild(fieldRow('Rotate',geomNum('rot')));
    if(F.sel.kind==='free'){ var tx=el('input'); tx.type='text'; tx.className='wide'; tx.value=F.sel.node.textContent;
      tx.onfocus=function(){F.pushUndo();}; tx.oninput=function(){ var fo=freeFor(F.sel.slideIdx,F.sel.id); fo.text=tx.value; F.renderLive(); }; sec.appendChild(field('Text',tx));
      var fs=el('input'); fs.type='number'; fs.value=(freeFor(F.sel.slideIdx,F.sel.id).size)||34; fs.onfocus=function(){F.pushUndo();}; fs.oninput=function(){ freeFor(F.sel.slideIdx,F.sel.id).size=parseFloat(fs.value)||34; reflow(); }; sec.appendChild(fieldRow('Font size',fs)); }
    host.appendChild(sec);

    var st=el('div','forge-sec'); st.appendChild(el('h4','forge-subh','Text style'));
    st.appendChild(field('Text color',colorInput(d.color||resolved(F.sel.node,'color'),function(v){ F.pushUndo(); d.color=v; reflow(); })));
    st.appendChild(field('Accent',colorInput((d.theme&&d.theme['--cyan'])||resolvedVar(F.sel.node,'--cyan'),function(v){ F.pushUndo(); d.theme=d.theme||{}; d.theme['--cyan']=v; reflow(); })));
    st.appendChild(field('Font',selectInput(F.fontChoices,d.font||'',function(v){ F.pushUndo(); d.font=v; reflow(); })));
    st.appendChild(field('Surface',colorInput((d.theme&&d.theme['--bg'])||resolvedVar(F.sel.node,'--bg'),function(v){ F.pushUndo(); d.theme=d.theme||{}; d.theme['--bg']=v; reflow(); })));
    host.appendChild(st);

    var an=el('div','forge-sec'); an.appendChild(el('h4','forge-subh','Animation'));
    an.appendChild(field('Effect',selectInput(F.animChoices,d.anim||'',function(v){ F.pushUndo();
      if(v) d.anim=v; else delete d.anim; reflow(); if(v&&ANIM_ENTRANCE[v]) replayAnim(F.sel.node); F.buildInspect(); })));
    if(d.anim){
      var dl=el('input'); dl.type='number'; dl.step=0.05; dl.min=0; dl.value=d.animDelay||0;
      dl.onfocus=function(){F.pushUndo();}; dl.oninput=function(){ d.animDelay=parseFloat(dl.value)||0; reflow(); if(ANIM_ENTRANCE[d.anim]) replayAnim(F.sel.node); };
      an.appendChild(fieldRow('Delay (s)',dl));
      var rp=el('button','forge-btn','▶ Replay'); rp.style.width='100%'; rp.onclick=function(){ replayAnim(F.sel.node); }; an.appendChild(rp);
      an.appendChild(el('div','forge-hint',ANIM_ENTRANCE[d.anim]?'Entrance — replays when the slide opens.':'Loops continuously.'));
    }
    host.appendChild(an);

    var nkey=F.sel.key, kids=(F.sel.kind!=='free'&&F.sel.node)?keyableChildren(F.sel.node):[];
    if((nkey&&nkey.indexOf('.')>-1)||kids.length){
      var nv=el('div','forge-sec'); nv.appendChild(el('h4','forge-subh','Nested'));
      if(nkey&&nkey.indexOf('.')>-1){ var pk=nkey.slice(0,nkey.lastIndexOf('.'));
        var up=el('button','forge-btn','↑ Select parent'); up.style.cssText='width:100%;margin-bottom:6px'; up.onclick=function(){ selectByKey(F.sel.slideIdx,pk); }; nv.appendChild(up); }
      if(kids.length){ nv.appendChild(el('div','forge-hint','Children — click to target one (Alt-click on canvas also drills in):'));
        kids.forEach(function(ch){ var ck=ch.getAttribute('data-el');
          var row=el('div','forge-srow'); row.appendChild(el('span','si',ch.tagName.toLowerCase()));
          row.appendChild(el('span','sl',((ch.textContent||'').trim().slice(0,30))||'—'));
          var a=ch.getAttribute('data-anim'); if(a) row.appendChild(el('span','st',a));
          row.onclick=function(){ selectByKey(F.sel.slideIdx,ck); }; nv.appendChild(row); }); }
      host.appendChild(nv);
    }

    var act=el('div','forge-sec'); var b=el('button','forge-btn warn',F.sel.kind==='free'?'🗑 Delete object':'↺ Reset element'); b.style.width='100%';
    b.onclick=function(){ var sl=F.sel.slideIdx,k=F.sel.key,id=F.sel.id,kind=F.sel.kind;
      F.do(kind==='free'?'delete object':'reset element',function(data){ var s=data.slides[sl];
        if(kind==='free') s.freeObjects=(s.freeObjects||[]).filter(function(f){return f.id!==id;}); else if(s.overrides) delete s.overrides[k]; });
      clearSel(); F.buildInspect(); };
    act.appendChild(b); host.appendChild(act); }
  function geomNum(key){ var d=selData(); var n=el('input'); n.type='number'; n.value=Math.round(d[key]||0);
    n.dataset.geom=key; n.onfocus=function(){F.pushUndo();}; n.oninput=function(){ d[key]=parseFloat(n.value)||0; reflow(); }; return n; }
  function syncGeomFields(){ var d=selData(); if(!d) return; ['x','y','rot'].forEach(function(k){ var n=D.querySelector('#forge-inspbody input[data-geom="'+k+'"]'); if(n&&D.activeElement!==n) n.value=Math.round(d[k]||0); }); }
  function resolved(node,prop){ try{ var v=getComputedStyle(node)[prop]; return /^rgb/.test(v)?rgbHex(v):(/^#/.test(v)?v:''); }catch(e){ return ''; } }
  function resolvedVar(node,tok){ try{ var v=getComputedStyle(node).getPropertyValue(tok).trim(); return /^#/.test(v)?v:''; }catch(e){ return ''; } }
  function rgbHex(v){ var m=v.match(/\d+/g); if(!m) return ''; return '#'+m.slice(0,3).map(function(x){return ('0'+(+x).toString(16)).slice(-2);}).join(''); }
  /* brief box-shadow flash on the selected node so an inspector change is visibly tied to it */
  function pulse(node){ if(!node) return; node.classList.remove('forge-live'); void node.offsetWidth; node.classList.add('forge-live'); }
  function reflow(){ if(!F.sel) return; var d=selData(); F.sel.kind==='free'?applyFree(F.sel.node,d):applyOverride(F.sel.node,d); refreshHandles(); pulse(F.sel.node); F.saveDebounced(); }

  /* =====================================================================
     SLIDE + DECK SETTINGS
     ===================================================================== */
  function buildSlideSettings(host){ var i=curSlide(), s=SG.data.slides[i]; if(!s) return;
    var sec=el('div','forge-sec'); sec.appendChild(el('h4','forge-subh','Slide '+(i+1)));
    sec.appendChild(field('Layout',selectInput(LAYOUTS,s.layout,function(v){ F.changeLayout(i,v); })));
    sec.appendChild(field('Ambient',selectInput(['auto','none','orbs','aurora','grid','rays','grain','contours','scan','waves','glow','constellation'], s.ambient||'auto', function(v){ F.do('ambient',function(){ SG.data.slides[i].ambient=v; }); })));
    var up=el('button','forge-btn','↑ Move up'); up.onclick=function(){ F.moveSlide(i,-1); }; up.disabled=(i===0);
    var dn=el('button','forge-btn','↓ Move down'); dn.onclick=function(){ F.moveSlide(i,1); }; dn.disabled=(i===SG.data.slides.length-1);
    var dl=el('button','forge-btn warn','🗑 Delete slide'); dl.onclick=function(){ F.delSlide(i); };
    [up,dn,dl].forEach(function(b){ b.style.cssText='width:100%;margin-top:6px'; sec.appendChild(b); });
    host.appendChild(sec);
    var dk=el('div','forge-sec'); dk.appendChild(el('h4','forge-subh','Deck'));
    var ti=el('input'); ti.type='text'; ti.className='wide'; ti.value=(SG.data.meta&&SG.data.meta.title)||'';
    ti.onfocus=function(){F.pushUndo();}; ti.oninput=function(){ SG.data.meta=SG.data.meta||{}; SG.data.meta.title=ti.value; D.title=ti.value; F.save(); F.buildNav(); };
    dk.appendChild(field('Title',ti));
    dk.appendChild(field('Theme',selectInput([['— pick —','']].concat(Object.keys(F.themes).map(function(n){return [n,n];})),'',function(v){ if(v) F.applyTheme(v); })));
    dk.appendChild(el('div','forge-hint','Theme tokens'));
    var tg=el('div','forge-tokens');
    TOKENS.forEach(function(tok){ var cell=el('label','forge-token');
      cell.appendChild(colorInput(resolvedRoot(tok),function(v){ F.pushUndo(); SG.data.theme=themeObj(); SG.data.theme[tok]=v; D.documentElement.style.setProperty(tok,v); F.save(); }));
      cell.appendChild(el('span',null,tok.replace(/^--/,''))); tg.appendChild(cell); });
    dk.appendChild(tg);
    host.appendChild(dk); }
  function resolvedRoot(tok){ try{ var v=getComputedStyle(D.documentElement).getPropertyValue(tok).trim(); return /^#/.test(v)?v:''; }catch(e){ return ''; } }
  function themeObj(){ if(SG.data.theme&&typeof SG.data.theme==='object') return SG.data.theme; var o={}; SG.data.theme=o; return o; }

  F.buildInspect=function(){ var body=D.getElementById('forge-inspbody'); if(!body) return; body.innerHTML='';
    if(F.sel) buildObjectPanel(body);
    buildContentEditor(curSlide(),body);
    buildSlideSettings(body); };

  /* =====================================================================
     OPERATIONS
     ===================================================================== */
  F.applyTheme=function(name){ var t=F.themes[name]; if(!t) return;
    F.do('apply theme '+name,function(){ SG.data.theme=clone(t.vars); SG.data.meta=SG.data.meta||{}; SG.data.meta.themeName=name; });
    var link=D.getElementById('forge-font'); if(!link){ link=el('link'); link.id='forge-font'; link.rel='stylesheet'; D.head.appendChild(link); } link.href=t.font;
    Object.keys(t.vars).forEach(function(k){ D.documentElement.style.setProperty(k,t.vars[k]); }); F.buildInspect(); };
  F.changeLayout=function(i,newL){ F.do('change layout',function(d){ var s=d.slides[i]; var old=s.content||{};
    var base=clone(DEFAULTS[newL]||{}); ['title','kicker','subtitle','accent'].forEach(function(k){ if(old[k]!=null && base[k]!==undefined) base[k]=old[k]; });
    s.layout=newL; s.content=base; if(s.overrides) delete s.overrides; }); clearSel(); F.buildInspect(); };
  F.addSlide=function(){ var i=curSlide(); F.do('add slide',function(){ SG.data.slides.splice(i+1,0,{layout:'cover',content:clone(DEFAULTS.cover)}); });
    location.hash='#'+(i+2); F.buildNav(); F.buildInspect(); };
  F.dupSlide=function(){ var i=curSlide(); F.do('duplicate slide',function(){ SG.data.slides.splice(i+1,0,clone(SG.data.slides[i])); }); location.hash='#'+(i+2); F.buildNav(); };
  F.delSlide=function(i){ if(SG.data.slides.length<=1) return; F.do('delete slide',function(){ SG.data.slides.splice(i,1); });
    location.hash='#'+clamp(i,1,SG.data.slides.length); clearSel(); F.buildNav(); F.buildInspect(); };
  F.moveSlide=function(i,dir){ var j=i+dir; if(j<0||j>=SG.data.slides.length) return; F.do('move slide',function(){ var a=SG.data.slides,t=a[i]; a[i]=a[j]; a[j]=t; });
    location.hash='#'+(j+1); clearSel(); F.buildNav(); F.buildInspect(); };
  F.addFree=function(type){ var i=curSlide(); var id='f'+Math.random().toString(36).slice(2,7);
    F.do('add '+type,function(){ var s=SG.data.slides[i]; s.freeObjects=s.freeObjects||[];
      s.freeObjects.push(type==='box'?{id:id,type:'box',x:520,y:300,w:240,h:140}:{id:id,type:'txt',x:520,y:320,text:'New text',size:34}); });
    var node=deckEl().querySelectorAll('.slide')[i].querySelector('[data-free="'+id+'"]'); if(node) selectNode(node); };

  /* ---------- DOWNLOAD ---------- */
  F.download=function(){ var doc=D.documentElement.cloneNode(true);
    [].slice.call(doc.querySelectorAll('.forge-chrome')).forEach(function(n){ n.remove(); });
    var dk=doc.querySelector('#deck'); if(dk) dk.innerHTML='';
    var dd=doc.querySelector('#deck-data'); if(dd) dd.textContent='\n'+JSON.stringify(SG.data,null,2)+'\n';
    var html='<!DOCTYPE html>\n'+doc.outerHTML; var blob=new Blob([html],{type:'text/html'});
    var a=el('a'); a.href=URL.createObjectURL(blob); a.download=((SG.data.meta&&SG.data.meta.title)||'deck').replace(/[^\w.-]+/g,'-').toLowerCase()+'.html';
    D.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1500); };

  /* ---------- mode toggle + fit ---------- */
  F.toggle=function(){ var on=!D.body.classList.contains('forge-edit'); D.body.classList.toggle('forge-edit',on);
    var l=D.getElementById('forge-launch'); if(l) l.textContent=on?'✓ Done':'✎ Edit'; if(!on) clearSel();
    F.fit(); F.buildNav(); F.buildInspect(); F.syncToolbar(); };
  F.fit=function(){ var deck=deckEl(); if(!deck) return; var edit=D.body.classList.contains('forge-edit');
    var padL=edit?248:0, padR=edit?280:0, padT=edit?52:0; var availW=W.innerWidth-padL-padR-40, availH=W.innerHeight-padT-40;
    var s=Math.min(availW/1280,availH/720); deck.style.transform='scale('+s+')'; deck.style.position='fixed';
    deck.style.left=(padL+(availW-1280*s)/2)+'px'; deck.style.top=(padT+(availH-720*s)/2)+'px'; deck.style.transformOrigin='top left'; };
  F.syncToolbar=function(){ if(F._undoBtn)F._undoBtn.disabled=!F.undo.length; if(F._redoBtn)F._redoBtn.disabled=!F.redo.length;
    var t=D.querySelector('#forge-bar .forge-title'); if(t) t.textContent=((SG.data.meta&&SG.data.meta.title)||'Untitled')+' · '+(SG.data.slides||[]).length+' slides'; };

  /* =====================================================================
     INIT
     ===================================================================== */
  F.init=function(){ F.buildChrome(); wireDeck();
    W.addEventListener('resize',function(){ if(D.body.classList.contains('forge-edit')) F.fit(); });
    W.addEventListener('hashchange',function(){ if(D.body.classList.contains('forge-edit')){ clearSel(); F.buildNav(); F.buildInspect(); } });
    W.addEventListener('keydown',function(e){
      if(e.target&&(e.target.isContentEditable||/^(input|textarea|select)$/i.test(e.target.tagName))) return;
      if(!D.body.classList.contains('forge-edit')) return;
      var nav=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Spacebar','PageUp','PageDown','Home','End'];
      if(nav.indexOf(e.key)>-1){
        if(F.sel && /^Arrow/.test(e.key)){ e.preventDefault(); e.stopImmediatePropagation();
          if(!F._nudging){ F.pushUndo(); } F._nudging=true; clearTimeout(F._nudgeT); F._nudgeT=setTimeout(function(){F._nudging=false;},500);
          var d=selData(), step=e.shiftKey?10:1;
          if(e.key==='ArrowRight')d.x=(d.x||0)+step; else if(e.key==='ArrowLeft')d.x=(d.x||0)-step; else if(e.key==='ArrowDown')d.y=(d.y||0)+step; else d.y=(d.y||0)-step;
          reflow(); syncGeomFields(); return; }
        e.preventDefault(); e.stopImmediatePropagation(); return; }
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?F.redoOp():F.undoOp(); }
      else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); F.download(); }
      else if(e.key==='Escape'){ hideCtxMenu(); clearSel(); F.buildInspect(); }
      else if((e.key==='Delete'||e.key==='Backspace')&&F.sel){ e.preventDefault();
        var sl=F.sel.slideIdx,k=F.sel.key,id=F.sel.id,kind=F.sel.kind;
        F.do('delete',function(data){ var s=data.slides[sl]; if(kind==='free') s.freeObjects=(s.freeObjects||[]).filter(function(f){return f.id!==id;}); else if(s.overrides) delete s.overrides[k]; });
        clearSel(); F.buildInspect(); }
    },true);
    try{ var saved=localStorage.getItem(F.key());
      if(saved && saved!==JSON.stringify(SG.data)){ var rb=D.getElementById('forge-restore'); rb.innerHTML='Unsaved edits from a previous session were found. ';
        var y=el('button','forge-btn primary','Restore'); var no=el('button','forge-btn','Discard');
        y.onclick=function(){ SG.data=JSON.parse(saved); F.commit(); rb.style.display='none'; }; no.onclick=function(){ F.save(); rb.style.display='none'; };
        rb.appendChild(y); rb.appendChild(no); rb.style.display='flex'; } }catch(e){}
    F.buildNav(); F.syncToolbar(); if(/[?&]edit/.test(location.search)) F.toggle();
  };
})();

</script>
<script>SG.boot();</script>
<script>Forge.init();</script>
</body>
